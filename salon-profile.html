        <div class="wm-label">Add a note for ${salon.name}</div>
        <div class="wm-message">
          <textarea id="wmBookNote" placeholder="e.g. 'It's my first visit' or 'Can I bring a reference photo?'"></textarea>
        </div>
        <div class="wm-actions">
          <button type="button" class="wm-btn primary" id="wmSendRequest" style="background:${accent};">Send booking request</button>
        </div>
      `;
      document.getElementById('wmSendRequest').addEventListener('click', () => sendSalonBookingRequest(accent));
    }

    function sendSalonBookingRequest(accent){
      const salon = currentSalon;
      const day = nextDays(7)[bookingDay];
      const dayLabel = `${DOW[day.getDay()]} ${day.getDate()}`;
      const hourLabel = HOURS[bookingHour];
      const noteEl = document.getElementById('wmBookNote');
      const note = (noteEl && noteEl.value.trim()) || null;
      const { names, total } = salonMenuSummary();
      const itemsLabel = names.join(', ');

      workerBox.innerHTML = `
        <button type="button" class="modal-close" id="wmClose">✕</button>
        <div class="wm-hero" style="background:linear-gradient(135deg, ${accent}, ${salon.theme.accentDark});">
          <div class="wm-avatar">${initials(salon.name)}</div>
          <h3>${salon.name}</h3>
          <div class="wm-role">${names.join(' + ')} · ${dayLabel} · ${hourLabel}</div>
        </div>
        <div class="wm-body">
          <div id="wmChatArea">
            <div class="wm-chat" id="wmChat">
              <div class="wm-bubble me">Hi! I'd like to book ${itemsLabel} (R${total}) for ${dayLabel} at ${hourLabel}.${note ? ' ' + note : ''}</div>
              <div class="wm-typing" id="wmTyping">${salon.name} is typing…</div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('wmClose').addEventListener('click', closeWorkerModal);

      setTimeout(() => {
        const seed = hashStr(currentSlug + itemsLabel) + bookingDay * 3 + bookingHour;
        const replies = [
          `Perfect, you're booked for ${itemsLabel} on ${dayLabel} at ${hourLabel}. See you then!`,
          `We're fully booked right at ${hourLabel} that day — could you do an hour later?`,
          `Got it! We'll have someone ready for your ${itemsLabel} on ${dayLabel}.`
        ];
        const reply = replies[seed % replies.length];
        const typing = document.getElementById('wmTyping');
        if (typing) typing.remove();
        const chat = document.getElementById('wmChat');
        const area = document.getElementById('wmChatArea');
        if (chat && area){
          chat.insertAdjacentHTML('beforeend', `<div class="wm-bubble them">${reply}</div>`);
          area.insertAdjacentHTML('beforeend', `<div class="wm-proto-note">Prototype — this reply is simulated. Real booking would message ${salon.name} directly and hold the slot.</div>`);
          addFollowUpComposer(chat, salon.name, accent);
        }
      }, 1100);
    }

    // ---------- Rent-a-Chair modal: pick weeks and/or days → inquiry emailed to the owner →
    // owner may want a short interview, otherwise it goes straight to payment → after payment
    // the chair becomes the renter's own slot on this page (they manage their own photos/work).
    // Messaging is intentionally disabled here — renter and owner don't chat until the email
    // inquiry is answered and payment is done.
    const chairModalOverlay = document.getElementById('chairModalOverlay');
    const chairModalBox = document.getElementById('chairModalBox');
    const DOW_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    let chairWeeks = [];
    let chairMode = 'weeks';        // 'weeks' | 'days'
    let chairSelectedWeeks = new Set(); // indices into chairWeeks
    let chairSelectedDays = new Set();  // 0=Mon … 6=Sun

    function nextMondays(n){
      const out = [];
      const d = new Date();
      const day = d.getDay();
      const daysUntilMonday = (8 - day) % 7 || 7;
      d.setDate(d.getDate() + daysUntilMonday);
      for (let i = 0; i < n; i++){
        const nd = new Date(d);
        nd.setDate(d.getDate() + i * 7);
        out.push(nd);
      }
      return out;
    }
    function fmtChairDate(d){ return d.toLocaleDateString('en-ZA', { day:'numeric', month:'short' }); }

    function styleChairTabs(){
      const accent = currentSalon.theme.accent;
      const wBtn = document.getElementById('chairTabWeeks');
      const dBtn = document.getElementById('chairTabDays');
      [ [wBtn, chairMode === 'weeks'], [dBtn, chairMode === 'days'] ].forEach(([btn, active]) => {
        btn.style.background = active ? accent : 'transparent';
        btn.style.color = active ? '#fff' : '#3A322C';
        btn.style.borderColor = active ? accent : '#E6DCCB';
      });
    }

    function renderChairWeeksSelector(){
      const area = document.getElementById('chairSelectorArea');
      area.innerHTML = `
        <div style="font-size:12.5px; font-weight:700; color:${currentSalon.theme.accent}; margin-bottom:4px;">Choose your week(s)</div>
        <div style="font-size:11.5px; color:#8a7c6c; margin-bottom:10px;">Tap a couple of weeks — pick a second, later week right after your first and everything in between fills in too.</div>
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px;" id="chairWeekGrid">
          ${chairWeeks.map((w, i) => `<button class="chair-week-chip" data-week="${i}" type="button" style="text-align:center; padding:10px 6px; border-radius:10px; border:1.5px solid #E6DCCB; font-size:12px; font-weight:600; color:#3A322C;">w/c ${fmtChairDate(w)}</button>`).join('')}
        </div>
      `;
      updateChairWeekChipStyles();
      area.querySelectorAll('.chair-week-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = Number(btn.dataset.week);
          if (chairSelectedWeeks.size === 1 && !chairSelectedWeeks.has(i)){
            const [only] = chairSelectedWeeks;
            if (i > only){
              for (let k = only; k <= i; k++) chairSelectedWeeks.add(k);
            } else {
              chairSelectedWeeks.add(i);
            }
          } else if (chairSelectedWeeks.has(i)){
            chairSelectedWeeks.delete(i);
          } else {
            chairSelectedWeeks.add(i);
          }
          updateChairWeekChipStyles();
          updateChairSummary();
        });
      });
    }

    function updateChairWeekChipStyles(){
      const accent = currentSalon.theme.accent;
      document.querySelectorAll('.chair-week-chip').forEach(b => {
        const active = chairSelectedWeeks.has(Number(b.dataset.week));
        b.style.borderColor = active ? accent : '#E6DCCB';
        b.style.background = active ? 'linear-gradient(135deg,#E7F0E9,#D5E6D9)' : 'transparent';
        b.style.color = active ? '#2E403D' : '#3A322C';
      });
    }

    function renderChairDaysSelector(){
      const area = document.getElementById('chairSelectorArea');
      area.innerHTML = `
        <div style="font-size:12.5px; font-weight:700; color:${currentSalon.theme.accent}; margin-bottom:4px;">Choose which days you need the chair</div>
        <div style="font-size:11.5px; color:#8a7c6c; margin-bottom:10px;">We'll work out a part-week rate from the full weekly price.</div>
        <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:6px;" id="chairDayGrid">
          ${DOW_SHORT.map((d, i) => `<button class="chair-day-chip" data-day="${i}" type="button" style="text-align:center; padding:10px 0; border-radius:10px; border:1.5px solid #E6DCCB; font-size:11.5px; font-weight:600; color:#3A322C;">${d}</button>`).join('')}
        </div>
      `;
      updateChairDayChipStyles();
      area.querySelectorAll('.chair-day-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = Number(btn.dataset.day);
          if (chairSelectedDays.has(i)) chairSelectedDays.delete(i); else chairSelectedDays.add(i);
          updateChairDayChipStyles();
          updateChairSummary();
        });
      });
    }

    function updateChairDayChipStyles(){
      const accent = currentSalon.theme.accent;
      document.querySelectorAll('.chair-day-chip').forEach(b => {
        const active = chairSelectedDays.has(Number(b.dataset.day));
        b.style.borderColor = active ? accent : '#E6DCCB';
        b.style.background = active ? 'linear-gradient(135deg,#E7F0E9,#D5E6D9)' : 'transparent';
        b.style.color = active ? '#2E403D' : '#3A322C';
      });
    }

    // Builds the itemized list + running total shown under either selector, and returns it
    // (also used later when composing the emailed inquiry).
    function chairSelectionSummary(){
      const price = CHAIR_LISTINGS[currentSlug];
      if (chairMode === 'weeks'){
        const idxs = [...chairSelectedWeeks].sort((a, b) => a - b);
        const rows = idxs.map(i => ({ label: `Week of ${fmtChairDate(chairWeeks[i])}`, amount: price }));
        const total = rows.reduce((s, r) => s + r.amount, 0);
        return { rows, total, unit: '', kind: 'weeks', count: idxs.length };
      } else {
        const dailyRate = Math.round(price / 7);
        const idxs = [...chairSelectedDays].sort((a, b) => a - b);
        const rows = idxs.map(i => ({ label: DOW_SHORT[i], amount: dailyRate }));
        const total = rows.reduce((s, r) => s + r.amount, 0);
        return { rows, total, unit: '/week', kind: 'days', count: idxs.length };
      }
    }

    function updateChairSummary(){
      const card = document.getElementById('chairSummaryCard');
      const sendBtn = document.getElementById('chairSendBtn');
      const s = chairSelectionSummary();
      if (s.rows.length === 0){
        card.style.display = 'none';
        sendBtn.disabled = true; sendBtn.style.opacity = '0.45'; sendBtn.style.pointerEvents = 'none';
        return;
      }
      card.style.display = 'block';
      card.innerHTML = `
        <div style="background:linear-gradient(135deg,#E7F0E9,#D5E6D9); border:1px solid #BFD6AE; border-radius:14px; padding:14px 16px; margin:14px 0;">
          <div style="font-size:11px; color:#4B6B3E; text-transform:uppercase; letter-spacing:0.4px; font-weight:700; margin-bottom:8px;">${s.kind === 'weeks' ? 'Weeks selected' : 'Days selected'}</div>
          <div style="display:flex; flex-direction:column; gap:5px; margin-bottom:8px;">
            ${s.rows.map(r => `<div style="display:flex; justify-content:space-between; font-size:12.5px; color:#2E403D;"><span>${r.label}</span><span style="font-weight:700;">R${r.amount.toLocaleString()}</span></div>`).join('')}
          </div>
          <div style="border-top:1px dashed #BFD6AE; padding-top:8px; display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:#2E403D;">
            <span>Total</span><span>R${s.total.toLocaleString()}${s.unit}</span>
          </div>
        </div>`;
      sendBtn.disabled = false; sendBtn.style.opacity = '1'; sendBtn.style.pointerEvents = 'auto';
      sendBtn.textContent = `Email inquiry to ${currentSalon.name} · R${s.total.toLocaleString()}${s.unit}`;
    }

    function openChairModal(){
      if (!(currentSlug in CHAIR_LISTINGS)) return;
      const price = CHAIR_LISTINGS[currentSlug];
      chairWeeks = nextMondays(16);
      chairMode = 'weeks'; chairSelectedWeeks = new Set(); chairSelectedDays = new Set();

      chairModalBox.innerHTML = `
        <div class="wm-modal-head" style="padding:22px 22px 4px; font-family:-apple-system, sans-serif;">
          <h3 style="font-family:Georgia, serif; font-size:19px; font-weight:400; margin-bottom:4px;">Rent a chair at ${currentSalon.name}</h3>
          <p style="font-size:12.5px; color:#8a7c6c;">R${price} / week · ${chairPerksFor(currentSlug).join(' · ')}</p>
        </div>
        <div style="padding:16px 22px 24px; font-family:-apple-system, sans-serif;">
          <div style="display:flex; gap:8px; margin-bottom:16px;">
            <button id="chairTabWeeks" type="button" class="chair-tab" style="flex:1; padding:10px 0; border-radius:9px; border:1.5px solid #E6DCCB; font-size:12.5px; font-weight:700;">By week</button>
            <button id="chairTabDays" type="button" class="chair-tab" style="flex:1; padding:10px 0; border-radius:9px; border:1.5px solid #E6DCCB; font-size:12.5px; font-weight:700;">By day</button>
          </div>
          <div id="chairSelectorArea"></div>
          <div id="chairSummaryCard" style="display:none;"></div>
          <button id="chairSendBtn" type="button" disabled style="display:block; width:100%; text-align:center; padding:13px; border-radius:10px; font-size:14px; font-weight:700; background:linear-gradient(180deg,#4E8A5D,#3F6B4A); color:#fff; opacity:0.45; pointer-events:none;">Email inquiry</button>
          <div id="chairConfirmArea" style="display:none; margin-top:16px;"></div>
        </div>`;

      styleChairTabs();
      renderChairWeeksSelector();

      document.getElementById('chairTabWeeks').addEventListener('click', () => {
        if (chairMode === 'weeks') return;
        chairMode = 'weeks'; chairSelectedDays = new Set();
        styleChairTabs(); renderChairWeeksSelector(); updateChairSummary();
      });
      document.getElementById('chairTabDays').addEventListener('click', () => {
        if (chairMode === 'days') return;
        chairMode = 'days'; chairSelectedWeeks = new Set();
        styleChairTabs(); renderChairDaysSelector(); updateChairSummary();
      });

      document.getElementById('chairSendBtn').addEventListener('click', sendChairInquiry);

      chairModalOverlay.classList.add('open');
    }

    // ---------- Step 2: the inquiry is "emailed" to the owner, who either wants a quick
    // interview first, or approves it straight away — either way it ends at the payment step.
    function sendChairInquiry(){
      const s = chairSelectionSummary();
      const salon = currentSalon;

      document.getElementById('chairSelectorArea').style.display = 'none';
      document.getElementById('chairSummaryCard').style.display = 'none';
      document.getElementById('chairSendBtn').style.display = 'none';
      document.querySelectorAll('.chair-tab').forEach(t => t.style.display = 'none');

      const confirm = document.getElementById('chairConfirmArea');
      confirm.style.display = 'block';
      confirm.innerHTML = `
        <div style="background:#F1E9DD; border-radius:14px; padding:18px 16px; text-align:center;">
          <div style="font-size:22px; margin-bottom:6px;">✉️</div>
          <div style="font-size:14px; font-weight:700; color:var(--espresso); margin-bottom:4px;">Inquiry emailed to ${salon.name}'s owner</div>
          <div style="font-size:12.5px; color:#8a7c6c;">${s.rows.length} ${s.kind === 'weeks' ? (s.rows.length === 1 ? 'week' : 'weeks') : (s.rows.length === 1 ? 'day/week' : 'days/week')} · R${s.total.toLocaleString()}${s.unit}</div>
          <div style="font-size:11.5px; color:#a89a86; margin-top:10px;">No chat opens yet — waiting for the owner to reply by email…</div>
        </div>`;

      // Simulated owner reply — in production this really would be an email to the owner's
      // account, and this wait would be however long they take to respond.
      const seed = hashStr(currentSlug + [...chairSelectedWeeks].join(',') + [...chairSelectedDays].join(','));
      const wantsInterview = seed % 2 === 0;

      setTimeout(() => {
        confirm.innerHTML = `
          <div style="background:#F1E9DD; border-radius:14px; padding:18px 16px; text-align:center;">
            <div style="font-size:22px; margin-bottom:6px;">${wantsInterview ? '🗓️' : '✓'}</div>
            <div style="font-size:14px; font-weight:700; color:var(--espresso); margin-bottom:4px;">
              ${wantsInterview ? `${salon.name} would like a short interview first` : `${salon.name} has approved your request`}
            </div>
            <div style="font-size:12.5px; color:#8a7c6c; margin-bottom:12px; line-height:1.5;">
              ${wantsInterview
                ? `They'll email you to set up a quick call or in-person chat before confirming. Once that's done, come back here and pay to lock in your chair.`
                : `No interview needed — you're clear to go straight to payment.`}
            </div>
            <div style="font-size:12.5px; color:#4B6B3E; font-weight:700; margin-bottom:14px;">${s.rows.length} ${s.kind === 'weeks' ? (s.rows.length === 1 ? 'week' : 'weeks') : (s.rows.length === 1 ? 'day/week' : 'days/week')} · R${s.total.toLocaleString()}${s.unit}</div>
            <button type="button" id="chairPayBtn" style="width:100%; padding:13px; border-radius:10px; font-size:14px; font-weight:700; background:linear-gradient(180deg,#4E8A5D,#3F6B4A); color:#fff;">Proceed to payment</button>
            <div style="font-size:11px; color:#a89a86; margin-top:10px;">Still no messaging until payment goes through — that keeps things simple and protects both sides.</div>
          </div>`;
        document.getElementById('chairPayBtn').addEventListener('click', () => simulateChairPayment(s));
      }, 1300);
    }

    // ---------- Step 3: simulated payment, then the renter sets up (or later edits) their own
    // slot — real uploaded photos, quick-pick specialty chips, and a "Save" that updates in place.
    let chairProfilePhoto = null;
    let chairWorkPhotos = [null, null, null, null];
    let chairSelectedSpecialties = new Set();
    let chairSlotName = '';
    let chairSlotSaved = null; // { name, profilePhoto, workPhotos, specialties } once a slot has been saved

    function specialtyPoolFor(salon){
      const names = [];
      salon.tags.forEach(tag => (SERVICE_CATALOG[tag] || []).forEach(([name]) => { if (!names.includes(name)) names.push(name); }));
      return names;
    }

    function renderChairSlotForm(salon, isEdit){
      const confirm = document.getElementById('chairConfirmArea');
      confirm.style.textAlign = 'left';
      confirm.style.display = 'block';
      const pool = specialtyPoolFor(salon);

      confirm.innerHTML = `
        <div style="text-align:center; margin-bottom:16px;">
          ${isEdit ? '' : `
            <div style="font-size:22px; margin-bottom:6px;">🎉</div>
            <div style="font-size:14px; font-weight:700; color:var(--espresso); margin-bottom:4px;">Payment received (prototype)</div>
          `}
          <div style="font-size:12px; color:#8a7c6c; line-height:1.5;">${isEdit ? `Edit your slot at ${salon.name} below.` : `Your chair at ${salon.name} is booked. Set up your own slot below — this is what visitors will see.`}</div>
        </div>

        <div style="font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#a89a86; margin-bottom:8px;">Your name</div>
        <input type="text" id="chairNameInput" value="${chairSlotName ? chairSlotName.replace(/"/g, '&quot;') : ''}" placeholder="e.g. Thabo M." style="width:100%; border:1px solid var(--line); border-radius:9px; padding:11px 13px; font-family:inherit; font-size:13px; background:#fff; color:var(--espresso); margin-bottom:6px; box-sizing:border-box;">
        <div style="font-size:11px; color:#a89a86; margin-bottom:18px;">This shows on your card instead of "Your Chair".</div>

        <div style="font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#a89a86; margin-bottom:8px;">Profile picture</div>
        <label for="chairProfileInput" style="display:flex; align-items:center; gap:12px; cursor:pointer; margin-bottom:18px;">
          <div id="chairProfilePreview" style="width:56px; height:56px; border-radius:50%; background:var(--ivory-deep); display:flex; align-items:center; justify-content:center; font-size:10px; color:#a89a86; flex:none; overflow:hidden; background-size:cover; background-position:center; ${chairProfilePhoto ? `background-image:url(${chairProfilePhoto});` : ''}">${chairProfilePhoto ? '' : 'Add'}</div>
          <span style="font-size:12.5px; font-weight:600; color:${salon.theme.accent};">${chairProfilePhoto ? 'Change profile picture' : 'Upload a profile picture'}</span>
        </label>
        <input type="file" accept="image/*" id="chairProfileInput" style="display:none;">

        <div style="font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#a89a86; margin-bottom:8px;">Your work — 4 photos</div>
        <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px;">
          ${[0, 1, 2, 3].map(i => `<label for="chairWorkInput${i}" id="chairWorkPreview${i}" style="aspect-ratio:1/1; border-radius:10px; background:var(--ivory-deep); display:flex; align-items:center; justify-content:center; font-size:16px; color:#a89a86; cursor:pointer; overflow:hidden; background-size:cover; background-position:center; ${chairWorkPhotos[i] ? `background-image:url(${chairWorkPhotos[i]});` : ''}">${chairWorkPhotos[i] ? '' : '＋'}</label>`).join('')}
        </div>
        ${[0, 1, 2, 3].map(i => `<input type="file" accept="image/*" id="chairWorkInput${i}" style="display:none;">`).join('')}

        <div style="font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#a89a86; margin-bottom:8px;">What you specialize in</div>
        <div style="font-size:11px; color:#a89a86; margin-bottom:8px;">Tap what applies — or type your own below.</div>
        <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;" id="chairSpecialtyChips">
          ${pool.map(name => `<button type="button" class="chair-specialty-chip" data-name="${name}" style="padding:7px 12px; border-radius:999px; border:1.5px solid #E6DCCB; font-family:-apple-system, sans-serif; font-size:11.5px; font-weight:600; color:#3A322C; background:transparent;">${name}</button>`).join('')}
        </div>
        <input type="text" id="chairSpecialtyInput" placeholder="Add your own, comma-separated…" style="width:100%; border:1px solid var(--line); border-radius:9px; padding:11px 13px; font-family:inherit; font-size:13px; background:#fff; color:var(--espresso); margin-bottom:18px; box-sizing:border-box;">

        <button type="button" id="chairSaveSlotBtn" style="width:100%; padding:13px; border-radius:10px; font-size:14px; font-weight:700; background:linear-gradient(180deg,#4E8A5D,#3F6B4A); color:#fff;">Save my slot</button>
      `;

      updateSpecialtyChipStyles(salon);
      document.querySelectorAll('.chair-specialty-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const name = chip.dataset.name;
          if (chairSelectedSpecialties.has(name)) chairSelectedSpecialties.delete(name); else chairSelectedSpecialties.add(name);
          updateSpecialtyChipStyles(salon);
        });
      });
      document.getElementById('chairProfileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          chairProfilePhoto = reader.result;
          const preview = document.getElementById('chairProfilePreview');
          preview.style.backgroundImage = `url(${reader.result})`;
          preview.textContent = '';
        };
        reader.readAsDataURL(file);
      });
      [0, 1, 2, 3].forEach(i => {
        document.getElementById(`chairWorkInput${i}`).addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            chairWorkPhotos[i] = reader.result;
            const preview = document.getElementById(`chairWorkPreview${i}`);
            preview.style.backgroundImage = `url(${reader.result})`;
            preview.textContent = '';
          };
          reader.readAsDataURL(file);
        });
      });
      document.getElementById('chairSaveSlotBtn').addEventListener('click', () => finalizeChairSlot(salon));
    }

    function updateSpecialtyChipStyles(salon){
      const accent = salon.theme.accent;
      document.querySelectorAll('.chair-specialty-chip').forEach(chip => {
        const active = chairSelectedSpecialties.has(chip.dataset.name);
        chip.style.borderColor = active ? accent : '#E6DCCB';
        chip.style.background = active ? accent : 'transparent';
        chip.style.color = active ? '#fff' : '#3A322C';
      });
    }

    function simulateChairPayment(s){
      const salon = currentSalon;
      const confirm = document.getElementById('chairConfirmArea');
      confirm.innerHTML = `<div style="text-align:center; padding:26px 0; font-family:-apple-system, sans-serif; font-size:13px; color:#8a7c6c;">Processing payment…</div>`;

      setTimeout(() => {
        chairSlotName = '';
        chairProfilePhoto = null;
        chairWorkPhotos = [null, null, null, null];
        chairSelectedSpecialties = new Set();
        renderChairSlotForm(salon, false);
      }, 1300);
    }

    // Reopens straight into the upload/specialty step, pre-filled with whatever was saved before —
    // used both when re-entering via "Edit my slot" and by clicking the saved card itself.
    function openChairSlotEditor(){
      if (!currentSlug || !(currentSlug in CHAIR_LISTINGS) || !chairSlotSaved) return;
      chairSlotName = chairSlotSaved.name || '';
      chairProfilePhoto = chairSlotSaved.profilePhoto;
      chairWorkPhotos = [...chairSlotSaved.workPhotos];
      chairSelectedSpecialties = new Set(chairSlotSaved.specialties.filter(sp => specialtyPoolFor(currentSalon).includes(sp)));
      chairModalBox.innerHTML = `
        <div class="wm-modal-head" style="padding:22px 22px 4px; font-family:-apple-system, sans-serif;">
          <h3 style="font-family:Georgia, serif; font-size:19px; font-weight:400; margin-bottom:4px;">Edit your slot at ${currentSalon.name}</h3>
        </div>
        <div style="padding:16px 22px 24px; font-family:-apple-system, sans-serif;">
          <div id="chairConfirmArea" style="display:block;"></div>
        </div>`;
      renderChairSlotForm(currentSalon, true);
      chairModalOverlay.classList.add('open');
    }

    function chairSlotCardHtml(salon, name, profilePhoto, workPhotos, specialties){
      const displayName = name && name.trim() ? name.trim() : 'Your Chair';
      return `
        <div class="staff-card" id="chairSlotCard" data-chair-slot="true" style="cursor:pointer;" title="View menu &amp; book">
          <div class="staff-top">
            <div class="staff-avatar" style="${profilePhoto ? `background-image:url(${profilePhoto}); background-size:cover; background-position:center; color:transparent;` : ''}">${profilePhoto ? '' : initials(displayName)}</div>
            <div class="staff-id">
              <h4>${displayName}</h4>
              <div class="staff-role sans">Independent · rents a chair here</div>
              <div class="staff-status working sans"><span class="dot"></span>Managed by you</div>
            </div>
          </div>
          <div class="staff-portfolio-label">What I'm good at</div>
          <div style="display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 12px;">
            ${specialties.length ? specialties.map(sp => `<span class="hero-tag" style="background:var(--ivory-deep); border:1px solid var(--line); color:var(--espresso-soft);">${sp}</span>`).join('') : '<span style="font-family:-apple-system, sans-serif; font-size:11px; color:#a89a86;">Add your specialties any time</span>'}
          </div>
          <div class="staff-portfolio-label">My work</div>
          <div class="staff-portfolio photos-4">
            ${workPhotos.map(p => `<div class="pf-thumb" style="${p ? `background-image:url(${p}); background-size:cover; background-position:center; color:transparent;` : ''}">Photo</div>`).join('')}
          </div>
          <div style="display:flex; gap:8px; margin:4px 16px 16px; margin-top:auto;">
            <div class="staff-btn" style="flex:1; margin:0; background:${salon.theme.accent}; color:#fff;">View menu &amp; book</div>
            <div class="staff-btn" data-chair-edit="true" style="flex:none; margin:0; padding-left:14px; padding-right:14px; background:var(--ivory-deep); color:var(--espresso-soft);">✎ Edit</div>
          </div>
        </div>`;
    }

    // ---------- Customer-facing: view the independent renter's own menu, add to cart, pay ----------
    let chairMenuCart = [];

    function chairMenuPriceFor(name, seed){
      const key = Object.keys(PRICE_MAP).find(k => name.toLowerCase().includes(k.toLowerCase()));
      const range = key ? PRICE_MAP[key] : [150, 400];
      const val = range[0] + (seed % (range[1] - range[0] + 1));
      return Math.round(val / 10) * 10;
    }

    function renderChairMenuCart(salon){
      const wrap = document.getElementById('chairMenuCartWrap');
      const btn = document.getElementById('chairMenuPayBtn');
      if (chairMenuCart.length === 0){
        wrap.style.display = 'none';
        btn.disabled = true; btn.style.opacity = '0.45'; btn.style.pointerEvents = 'none';
        btn.textContent = 'Add something to your cart first';
        return;
      }
      const total = chairMenuCart.reduce((s, i) => s + i.price * i.qty, 0);
      wrap.style.display = 'block';
      wrap.innerHTML = `
        <div style="background:var(--ivory-deep); border-radius:12px; padding:12px 14px; margin:14px 0;">
          <div style="font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#a89a86; margin-bottom:8px;">Your cart</div>
          ${chairMenuCart.map(i => `<div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--espresso-soft); padding:3px 0;"><span>${i.qty > 1 ? `${i.qty} × ` : ''}${i.name}</span><span style="font-weight:700;">R${(i.price * i.qty).toLocaleString()}</span></div>`).join('')}
          <div style="border-top:1px dashed var(--line); margin-top:8px; padding-top:8px; display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:var(--espresso);"><span>Total</span><span>R${total.toLocaleString()}</span></div>
        </div>`;
      btn.disabled = false; btn.style.opacity = '1'; btn.style.pointerEvents = 'auto';
      btn.textContent = `Pay R${total.toLocaleString()}`;
    }

    function openChairSlotMenu(){
      if (!chairSlotSaved) return;
      const salon = currentSalon;
      chairMenuCart = [];
      const items = chairSlotSaved.specialties.map((name, i) => ({ name, price: chairMenuPriceFor(name, hashStr(currentSlug + name + i)) }));

      const menuDisplayName = chairSlotSaved.name && chairSlotSaved.name.trim() ? chairSlotSaved.name.trim() : 'Your Chair';
      chairModalBox.innerHTML = `
        <div class="wm-hero" style="background:linear-gradient(135deg, ${salon.theme.accent}, ${salon.theme.accentDark});">
          <div class="wm-avatar" style="${chairSlotSaved.profilePhoto ? `background-image:url(${chairSlotSaved.profilePhoto}); background-size:cover; background-position:center; color:transparent;` : ''}">${chairSlotSaved.profilePhoto ? '' : initials(menuDisplayName)}</div>
          <h3>${menuDisplayName}</h3>
          <div class="wm-role">Independent · at ${salon.name}</div>
        </div>
        <div class="wm-body">
          ${items.length === 0
            ? `<div style="font-family:-apple-system, sans-serif; font-size:13px; color:#8a7c6c; text-align:center; padding:20px 0;">This specialist hasn't added their menu yet — check back soon.</div>`
            : `
              <div class="wm-label">Menu — pick what you'd like</div>
              <div class="wm-services" id="chairMenuList">
                ${items.map((it, i) => `
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:#fff;">
                    <span style="flex:1; font-family:-apple-system, sans-serif; font-size:13px; color:var(--espresso-soft);">${it.name}</span>
                    <b style="font-family:-apple-system, sans-serif; font-size:13px; color:var(--gold-deep);">R${it.price}</b>
                    <button type="button" class="chair-menu-add" data-i="${i}" style="font-family:-apple-system, sans-serif; font-size:11.5px; font-weight:700; color:#fff; background:${salon.theme.accent}; padding:8px 12px; border-radius:8px;">Add</button>
                  </div>
                `).join('')}
              </div>
              <div id="chairMenuCartWrap" style="display:none;"></div>
              <button type="button" id="chairMenuPayBtn" disabled style="display:block; width:100%; text-align:center; padding:13px; border-radius:10px; font-size:14px; font-weight:700; background:linear-gradient(180deg,#4E8A5D,#3F6B4A); color:#fff; opacity:0.45; pointer-events:none;">Add something to your cart first</button>
              <div id="chairMenuPayArea" style="margin-top:16px;"></div>
            `}
        </div>`;

      if (items.length){
        document.querySelectorAll('.chair-menu-add').forEach(btn => {
          btn.addEventListener('click', () => {
            const it = items[Number(btn.dataset.i)];
            const existing = chairMenuCart.find(c => c.name === it.name);
            if (existing) existing.qty++; else chairMenuCart.push({ name: it.name, price: it.price, qty: 1 });
            renderChairMenuCart(salon);
          });
        });
        document.getElementById('chairMenuPayBtn').addEventListener('click', () => payChairMenuCart(salon));
      }

      chairModalOverlay.classList.add('open');
    }

    function payChairMenuCart(salon){
      const total = chairMenuCart.reduce((s, i) => s + i.price * i.qty, 0);
      const area = document.getElementById('chairMenuPayArea');
      document.getElementById('chairMenuList').style.display = 'none';
      document.getElementById('chairMenuCartWrap').style.display = 'none';
      document.getElementById('chairMenuPayBtn').style.display = 'none';
      area.innerHTML = `<div style="text-align:center; padding:20px 0; font-family:-apple-system, sans-serif; font-size:13px; color:#8a7c6c;">Processing payment…</div>`;
      setTimeout(() => {
        area.innerHTML = `
          <div style="background:#F1E9DD; border-radius:14px; padding:18px 16px; text-align:center; font-family:-apple-system, sans-serif;">
            <div style="font-size:22px; margin-bottom:6px;">✓</div>
            <div style="font-size:14px; font-weight:700; color:var(--espresso); margin-bottom:4px;">Payment received (prototype)</div>
            <div style="font-size:12.5px; color:#8a7c6c;">R${total.toLocaleString()} sent — your booking with ${chairSlotSaved.name && chairSlotSaved.name.trim() ? chairSlotSaved.name.trim() : 'Your Chair'} at ${salon.name} is confirmed.</div>
          </div>`;
      }, 1300);
    }

    function finalizeChairSlot(salon){
      chairSlotName = (document.getElementById('chairNameInput').value || '').trim();
      const typed = document.getElementById('chairSpecialtyInput').value.trim();
      const typedList = typed ? typed.split(',').map(x => x.trim()).filter(Boolean) : [];
      const specialties = [...new Set([...chairSelectedSpecialties, ...typedList])];
      chairSlotSaved = { name: chairSlotName, profilePhoto: chairProfilePhoto, workPhotos: [...chairWorkPhotos], specialties };

      const html = chairSlotCardHtml(salon, chairSlotName, chairProfilePhoto, chairWorkPhotos, specialties);
      const existing = document.getElementById('chairSlotCard');
      if (existing){
        existing.outerHTML = html;
      } else {
        const grid = document.querySelector('#page .staff-grid');
        if (grid) grid.insertAdjacentHTML('beforeend', html);
      }

      const confirm = document.getElementById('chairConfirmArea');
      confirm.style.textAlign = 'center';
      confirm.innerHTML = `
        <div style="background:#F1E9DD; border-radius:14px; padding:18px 16px; text-align:center;">
          <div style="font-size:22px; margin-bottom:6px;">⏳</div>
          <div style="font-size:14px; font-weight:700; color:var(--espresso); margin-bottom:4px;">Saving your slot…</div>
        </div>`;

      saveChairSlot(currentSlug, chairSlotSaved).then(() => {
        confirm.innerHTML = `
          <div style="background:#F1E9DD; border-radius:14px; padding:18px 16px; text-align:center;">
            <div style="font-size:22px; margin-bottom:6px;">✓</div>
            <div style="font-size:14px; font-weight:700; color:var(--espresso); margin-bottom:4px;">Your slot is live — and saved</div>
            <div style="font-size:12px; color:#8a7c6c; line-height:1.5; margin-bottom:14px;">Close this and scroll down to "Who's working today" — your card is right there alongside ${salon.name}'s own team. It'll still be here next time this page loads.</div>
            <button type="button" id="chairEditAgainBtn" style="width:100%; padding:12px; border-radius:10px; font-size:13px; font-weight:700; background:var(--ivory-deep); color:var(--espresso-soft);">Edit my slot again</button>
          </div>`;
        document.getElementById('chairEditAgainBtn').addEventListener('click', () => renderChairSlotForm(salon, true));
      });
    }
    chairModalOverlay.addEventListener('click', (e) => { if (e.target === chairModalOverlay) chairModalOverlay.classList.remove('open'); });

    // Open the worker modal from either a card click (profile) or its Book button (straight to calendar)
    document.addEventListener('click', (e) => {
      const chairBtn = e.target.closest('#chairRentBtn');
      if (chairBtn){
        e.preventDefault();
        openChairModal();
        return;
      }
      const salonBookBtn = e.target.closest('[data-open="salon-book"]');
      if (salonBookBtn){
        e.preventDefault();
        openSalonMenu();
        return;
      }
      const editChip = e.target.closest('[data-chair-edit]');
      if (editChip){
        e.preventDefault();
        openChairSlotEditor();
        return;
      }
      const bookBtn = e.target.closest('.staff-btn');
      if (bookBtn && !bookBtn.classList.contains('disabled') && !e.target.closest('[data-chair-slot]')){
        e.preventDefault();
        openWorkerProfile(Number(bookBtn.dataset.idx), true);
        return;
      }
      const slotCard = e.target.closest('[data-chair-slot]');
      if (slotCard){
        openChairSlotMenu();
        return;
      }
      const card = e.target.closest('.staff-card');
      if (card){
        openWorkerProfile(Number(card.dataset.idx), false);
      }
    });

    workerOverlay.addEventListener('click', (e) => {
      if (e.target === workerOverlay) closeWorkerModal();
    });

    // ---------- Palette customizer — in the real product this lives in the owner's dashboard;
    // here it re-themes the live page so you can preview it against your own brand colour. ----------
    const PALETTE_PRESETS = ['#7A1F2A','#C9A961','#3F6B4A','#5E8C86','#7B5EA7','#D63C7A','#B8794A','#A23B4E','#6E8B8B','#D97B56','#241E1A','#3A322C'];
    let salonDefaultTheme = null;

    function darkenColor(hex, amt){
      const c = hex.replace('#', '');
      const num = parseInt(c, 16);
      let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
      r = Math.round(r * (1 - amt)); g = Math.round(g * (1 - amt)); b = Math.round(b * (1 - amt));
      return '#' + [r, g, b].map(x => Math.max(0, Math.min(255, x)).toString(16).padStart(2, '0')).join('');
    }

    function reattachChairSlotIfAny(){
      if (!chairSlotSaved) return;
      const grid = document.querySelector('#page .staff-grid');
      if (grid) grid.insertAdjacentHTML('beforeend', chairSlotCardHtml(currentSalon, chairSlotSaved.name, chairSlotSaved.profilePhoto, chairSlotSaved.workPhotos, chairSlotSaved.specialties));
    }

    function applyPaletteColor(hex){
      if (!currentSalon) return;
      if (!salonDefaultTheme) salonDefaultTheme = { accent: currentSalon.theme.accent, accentDark: currentSalon.theme.accentDark };
      currentSalon.theme.accent = hex;
      currentSalon.theme.accentDark = darkenColor(hex, 0.35);
      render();
      reattachChairSlotIfAny();
    }

    document.getElementById('paletteSwatches').innerHTML = PALETTE_PRESETS.map(c => `<button type="button" class="palette-swatch" data-color="${c}" style="background:${c};"></button>`).join('');
    document.querySelectorAll('.palette-swatch').forEach(sw => {
      sw.addEventListener('click', () => applyPaletteColor(sw.dataset.color));
    });
    document.getElementById('paletteCustomInput').addEventListener('input', (e) => applyPaletteColor(e.target.value));
    document.getElementById('paletteFab').addEventListener('click', () => {
      document.getElementById('palettePanel').classList.toggle('open');
    });
    document.getElementById('paletteResetBtn').addEventListener('click', () => {
      if (!salonDefaultTheme || !currentSalon) return;
      currentSalon.theme.accent = salonDefaultTheme.accent;
      currentSalon.theme.accentDark = salonDefaultTheme.accentDark;
      render();
      reattachChairSlotIfAny();
    });

    render();
  </script>

  <script>
  (function(){
    const burgerBtn = document.getElementById('burgerBtn');
    const menuPanel = document.getElementById('menuPanel');
    if (burgerBtn && menuPanel){
      burgerBtn.addEventListener('click', function(e){
        e.stopPropagation();
        menuPanel.classList.toggle('open');
      });
      document.addEventListener('click', function(e){
        if (!menuPanel.contains(e.target) && e.target !== burgerBtn){
          menuPanel.classList.remove('open');
        }
      });
    }
  })();
  </script>
</body>
</html>
