<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salon — @MySalon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF6F0; --ivory-deep:#F1E9DD; --espresso:#241E1A; --espresso-soft:#3A322C;
    --gold:#C9A961; --gold-deep:#A9863F; --blush:#D9AFA6; --line:#E6DCCB; --white:#FFFFFF;
    --maroon:#7A1F2A; --green:#3F6B4A;
    --shadow: 0 20px 40px -20px rgba(36,30,26,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:"Georgia", serif; background:var(--ivory); color:var(--espresso); -webkit-font-smoothing:antialiased; }
  .sans{ font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 32px; background: var(--espresso); color: var(--ivory);
  }
  .brand{ font-size: 22px; }
  .brand b{ color: var(--gold); font-weight:600; }
  .back-link{ font-family:-apple-system, sans-serif; font-size:13px; color: var(--gold); }

  /* Base hero — overridden per salon "template" below; each salon's owner controls
     the background, accent color, font and headline wording, the visitor just sees the result. */
  .hero{ padding: 56px 32px; color: var(--ivory); position:relative; overflow:hidden; }
  .hero-inner{ max-width:1180px; margin:0 auto; position:relative; z-index:2; }
  .hero-top{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px; align-items:flex-start; }
  .hero-tier{
    display:inline-flex; align-items:center; gap:6px;
    font-family:-apple-system, sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;
    padding:6px 12px; border-radius:999px; margin-bottom:14px;
    background: rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28); color: var(--ivory);
  }
  .hero h1{ font-size:34px; font-weight:400; margin-bottom:6px; }
  .hero-tagline{ font-size:16px; font-style:italic; margin-bottom:12px; opacity:0.92; }
  .hero-meta{ font-family:-apple-system, sans-serif; font-size:13.5px; color: rgba(250,246,240,0.8); margin-bottom:14px; }
  .hero-meta .stars{ color: inherit; filter: brightness(1.3); }
  .hero-tags{ display:flex; gap:8px; flex-wrap:wrap; }
  .hero-tag{
    font-family:-apple-system, sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px;
    background: rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.18); color: var(--ivory);
    padding:5px 11px; border-radius:999px;
  }
  .hero-book{
    background: var(--white); color: var(--espresso);
    font-family:-apple-system, sans-serif; font-weight:700; font-size:14px; padding:13px 28px; border-radius:9px; flex:none;
  }
  .rent-chair-note{
    margin-top:18px; font-family:-apple-system, sans-serif; font-size:12.5px; color: rgba(250,246,240,0.85);
    display:flex; align-items:center; gap:8px;
  }
  .photo-flag{
    position:absolute; top:16px; right:20px; z-index:3;
    font-family:-apple-system, sans-serif; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;
    background: rgba(0,0,0,0.28); padding:5px 10px; border-radius:999px; color:rgba(255,255,255,0.85);
  }

  /* Template: classic — left-aligned, deep charcoal panel (the original look) */
  .hero.tpl-classic{ background: linear-gradient(135deg, #3A322C, #241E1A); }

  /* Template: bold — full-bleed accent color/photo block, centered */
  .hero.tpl-bold{ text-align:center; }
  .hero.tpl-bold .hero-top{ flex-direction:column; align-items:center; }
  .hero.tpl-bold .hero-tags{ justify-content:center; }
  .hero.tpl-bold h1{ font-size:40px; }

  /* Template: minimal — light, logo-forward, owner's brand mark front and center */
  .hero.tpl-minimal{ background: var(--ivory); color: var(--espresso); padding-top:48px; }
  .hero.tpl-minimal .hero-tier{ background: rgba(36,30,26,0.06); border-color: rgba(36,30,26,0.12); color: var(--espresso-soft); }
  .hero.tpl-minimal .hero-meta{ color:#6b5d4f; }
  .hero.tpl-minimal .hero-tag{ background: rgba(36,30,26,0.05); border-color: rgba(36,30,26,0.12); color: var(--espresso-soft); }
  .hero.tpl-minimal .rent-chair-note{ color:#6b5d4f; }
  .hero.tpl-minimal .photo-flag{ background: rgba(36,30,26,0.08); color:#6b5d4f; }
  .hero.tpl-minimal .hero-book{ color: var(--white); }
  .hero-logo-badge{
    width:74px; height:74px; border-radius:50%; margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, sans-serif; font-weight:700; font-size:22px; color: var(--white);
    box-shadow: var(--shadow);
  }

  /* Font choices an owner can pick for their headline wording */
  .font-elegant h1, .font-elegant .hero-tagline{ font-family:'Playfair Display', Georgia, serif; }
  .font-modern h1{ font-family:'Poppins', -apple-system, sans-serif; font-weight:700; }
  .font-modern .hero-tagline{ font-family:'Poppins', -apple-system, sans-serif; font-style:normal; font-weight:500; }

  .menu-section{ max-width:1180px; margin:0 auto; padding: 40px 32px 8px; }
  .menu-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px; }
  .menu-head h2{ font-size:24px; font-weight:400; }
  .menu-head h2 span{ color: var(--gold-deep); font-style:italic; }
  .menu-sub{ font-family:-apple-system, sans-serif; font-size:12.5px; color:#8a7c6c; margin-bottom:20px; }
  .menu-groups{ display:grid; grid-template-columns: repeat(2, 1fr); gap:20px; }
  .menu-group{
    background: var(--white); border:1px solid var(--line); border-radius:14px; padding:20px 22px;
  }
  .menu-group h3{
    font-family:-apple-system, sans-serif; font-size:11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.5px; color: var(--maroon); margin-bottom:14px;
  }
  .menu-item{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    font-family:-apple-system, sans-serif; font-size:13.5px; color: var(--espresso-soft);
    padding:9px 0; border-bottom:1px dashed var(--line);
  }
  .menu-item:last-child{ border-bottom:none; }
  .menu-item .m-name{ min-width:0; }
  .menu-price{ font-weight:700; color: var(--gold-deep); flex:none; }

  .staff-section{ max-width:1180px; margin:0 auto; padding: 40px 32px 8px; }
  .staff-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px; }
  .staff-head h2{ font-size:24px; font-weight:400; }
  .staff-head h2 span{ color: var(--gold-deep); font-style:italic; }
  .staff-sub{ font-family:-apple-system, sans-serif; font-size:12.5px; color:#8a7c6c; margin-bottom:22px; }

  .staff-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:18px; padding-bottom:70px; }
  .staff-card{
    background: var(--white); border:1px solid var(--line); border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column; cursor:pointer; transition: transform .15s ease, box-shadow .15s ease;
  }
  .staff-card:hover{ transform: translateY(-3px); box-shadow: var(--shadow); }
  .staff-top{ display:flex; align-items:center; gap:12px; padding:16px 16px 0; }
  .staff-avatar{
    width:54px; height:54px; border-radius:50%; flex:none;
    background: linear-gradient(135deg, var(--ivory-deep), var(--blush));
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, sans-serif; font-size:9.5px; color: var(--gold-deep);
  }
  .staff-id{ min-width:0; }
  .staff-card h4{ font-size:15px; margin-bottom:3px; }
  .staff-role{ font-family:-apple-system, sans-serif; font-size:11px; color:#8a7c6c; margin-bottom:6px; }
  .staff-status{
    display:inline-flex; align-items:center; gap:6px; font-family:-apple-system, sans-serif;
    font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:999px;
  }
  .staff-status .dot{ width:6px; height:6px; border-radius:50%; }
  .staff-status.working{ background:rgba(63,107,74,0.12); color: var(--green); }
  .staff-status.working .dot{ background: var(--green); }
  .staff-status.off{ background:rgba(122,31,42,0.08); color: var(--maroon); }
  .staff-status.off .dot{ background: var(--maroon); }

  .staff-services{ padding:14px 16px 0; display:flex; flex-direction:column; gap:7px; }
  .svc-row{
    display:flex; justify-content:space-between; gap:10px;
    font-family:-apple-system, sans-serif; font-size:12px; color: var(--espresso-soft);
  }
  .svc-price{ font-weight:700; color: var(--gold-deep); flex:none; }

  .staff-portfolio-label{
    font-family:-apple-system, sans-serif; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.4px; color:#a89a86; padding:14px 16px 6px;
  }
  .staff-portfolio{ display:grid; gap:6px; padding:0 16px 16px; }
  .staff-portfolio.photos-2{ grid-template-columns: repeat(2, 1fr); }
  .staff-portfolio.photos-4{ grid-template-columns: repeat(4, 1fr); }
  .staff-portfolio.photos-8{ grid-template-columns: repeat(4, 1fr); }

  /* Premium-tier perk: the salon's own exhibition gallery, separate from each worker's portfolio */
  .exhibit-section{ max-width:1180px; margin:0 auto; padding: 40px 32px 8px; }
  .exhibit-head{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .exhibit-head h2{ font-size:26px; font-weight:400; }
  .exhibit-head .tier-chip{
    font-family:-apple-system, sans-serif; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.5px; color:#4A3A12; background: linear-gradient(135deg, #F3D68A, #C9A961);
    padding:5px 12px; border-radius:999px;
  }
  .exhibit-sub{ font-family:-apple-system, sans-serif; font-size:13px; color:#8a7c6c; margin: 4px 0 18px; }
  .exhibit-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; }
  .exhibit-photo{
    aspect-ratio:1/1; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, sans-serif; font-size:11px; color:rgba(0,0,0,0.45);
  }
  @media (max-width: 700px){ .exhibit-grid{ grid-template-columns: repeat(2, 1fr); } }
  .pf-thumb{
    aspect-ratio:1/1; border-radius:8px; background: linear-gradient(135deg, var(--ivory-deep), var(--blush));
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, sans-serif; font-size:9px; color: var(--gold-deep);
  }

  .staff-btn{
    display:block; text-align:center; margin:4px 16px 16px; margin-top:auto;
    font-family:-apple-system, sans-serif; font-size:12px; font-weight:700;
    padding:10px 18px; border-radius:8px; background: var(--espresso); color: var(--gold);
  }
  .staff-btn.disabled{ background: var(--ivory-deep); color:#a89a86; pointer-events:none; }

  .not-found{
    max-width:700px; margin:80px auto; padding:0 32px; text-align:center;
    font-family:-apple-system, sans-serif; color:#6b5d4f;
  }
  .not-found h2{ font-family:Georgia, serif; font-size:24px; color:var(--espresso); margin-bottom:10px; }
  .not-found a{ color: var(--gold-deep); font-weight:600; }

  footer{ background: var(--espresso); color: rgba(250,246,240,0.6); text-align:center; padding: 28px; font-family:-apple-system, sans-serif; font-size:12px; }

  @media (max-width: 900px){
    .staff-grid{ grid-template-columns: repeat(2, 1fr); }
    .menu-groups{ grid-template-columns: 1fr; }
  }
  @media (max-width: 560px){
    .staff-grid{ grid-template-columns: 1fr; }
  }

  /* ---------- Rent-a-Chair CTA (only for salons that list a spare chair) ---------- */
  .chair-banner{
    max-width:1180px; margin: 0 auto; padding: 0 32px;
  }
  .chair-banner-inner{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px;
    background: linear-gradient(135deg, #E7F0E9, #D5E6D9); border:1px solid #BFD6AE;
    border-radius:18px; padding:18px 22px; margin-top:24px; font-family:-apple-system, sans-serif;
  }
  .chair-banner h4{ font-family:Georgia, serif; font-size:16px; font-weight:400; margin-bottom:4px; color:#2E403D; }
  .chair-banner .sub{ font-size:12.5px; color:#4B6B3E; }
  .chair-banner .price{ font-size:13px; font-weight:700; color:#2E403D; margin-top:4px; }
  .chair-btn{
    flex:none; background: linear-gradient(180deg, #4E8A5D, #3F6B4A); color:#fff;
    font-size:13px; font-weight:700; padding:11px 22px; border-radius:999px;
  }

  /* ---------- Palette customizer — the business owner's own colour, applied live ---------- */
  .palette-fab{
    position:fixed; bottom:24px; right:24px; z-index:150; width:52px; height:52px; border-radius:50%;
    background: var(--espresso); color: var(--gold); font-size:20px; display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow); cursor:pointer; border:none;
  }
  .palette-panel{
    position:fixed; bottom:88px; right:24px; z-index:150; width:250px; background:#fff; border-radius:16px;
    box-shadow: var(--shadow); padding:16px; display:none; font-family:-apple-system, sans-serif;
  }
  .palette-panel.open{ display:block; }
  .palette-panel .p-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#8a7c6c; margin-bottom:2px; }
  .palette-panel .p-sub{ font-size:11px; color:#a89a86; margin-bottom:10px; }
  .palette-swatches{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:12px; }
  .palette-swatch{ width:28px; height:28px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0; }
  .palette-custom-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .palette-custom-row input[type=color]{ width:34px; height:34px; border:none; border-radius:8px; padding:0; background:none; cursor:pointer; }
  .palette-reset{ font-size:11.5px; color:#8a7c6c; text-decoration:underline; background:none; border:none; cursor:pointer; }

  /* ---------- WORKER MODAL (profile → book a time → message) ---------- */
  .modal-overlay{
    display:none; position:fixed; inset:0; z-index:200; background: rgba(36,30,26,0.6);
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background: var(--ivory); border-radius:18px; max-width:520px; width:100%;
    max-height:88vh; overflow-y:auto; box-shadow: var(--shadow); position:relative;
  }
  .modal-close{
    position:absolute; top:14px; right:14px; z-index:2; width:30px; height:30px; border-radius:50%;
    background: rgba(36,30,26,0.08); display:flex; align-items:center; justify-content:center;
    font-size:14px; color: var(--espresso-soft);
  }
  .wm-hero{
    padding:26px 26px 20px; color:#fff; border-radius:18px 18px 0 0; position:relative; overflow:hidden;
  }
  .wm-hero .wm-avatar{
    width:64px; height:64px; border-radius:50%; background: rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:center; font-family:-apple-system, sans-serif;
    font-weight:700; font-size:20px; margin-bottom:12px; position:relative;
  }
  /* Premium-tier perk: a cover photo band behind the hero, plus a "profile picture" style avatar
     (owner picks the cover color/photo from the salon's own brand palette). */
  .wm-hero.wm-hero-premium{ padding-top:64px; }
  .wm-hero .wm-cover{
    position:absolute; top:0; left:0; right:0; height:56px; opacity:0.9;
  }
  .wm-hero .wm-avatar.wm-avatar-photo{
    width:72px; height:72px; border:3px solid rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.14); box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }
  .wm-hero .wm-avatar-cam{
    position:absolute; bottom:-2px; right:-2px; width:20px; height:20px; border-radius:50%;
    background:#fff; color:#5A4E3E; font-size:10px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.3);
  }
  .wm-hero h3{ font-size:21px; margin-bottom:4px; }
  .wm-hero .wm-role{ font-family:-apple-system, sans-serif; font-size:12.5px; opacity:0.85; }
  .wm-hero .wm-status{
    display:inline-flex; align-items:center; gap:6px; margin-top:10px;
    font-family:-apple-system, sans-serif; font-size:11px; font-weight:700;
    background: rgba(255,255,255,0.16); padding:5px 11px; border-radius:999px;
  }
  .wm-hero .wm-status .dot{ width:6px; height:6px; border-radius:50%; background:#fff; }

  .wm-body{ padding:22px 26px 26px; font-family:-apple-system, sans-serif; }
  .wm-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#a89a86; margin-bottom:10px; }
  .wm-portfolio{ display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-bottom:22px; }
  .wm-photo{
    aspect-ratio:1/1; border-radius:10px; background: linear-gradient(135deg, var(--ivory-deep), var(--blush));
    display:flex; align-items:center; justify-content:center; font-size:10px; color: var(--gold-deep);
  }
  .wm-services{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .wm-svc-row{ display:flex; justify-content:space-between; font-size:13px; color: var(--espresso-soft); }
  .wm-svc-row b{ color: var(--gold-deep); }

  .wm-good-at{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .wm-good-chip{
    font-size:11.5px; font-weight:600; color: var(--gold-deep); background: var(--ivory-deep);
    border:1px solid var(--line); border-radius:999px; padding:6px 12px;
  }

  .lightbox-overlay{
    position:fixed; inset:0; background:rgba(20,15,12,0.85); z-index:200; display:none;
    align-items:center; justify-content:center; padding:24px;
  }
  .lightbox-overlay.open{ display:flex; }
  .lightbox-box{ position:relative; width:min(520px, 92vw); }
  .lightbox-photo{
    width:100%; aspect-ratio:4/3; border-radius:16px; background: linear-gradient(135deg, var(--ivory-deep), var(--blush));
    display:flex; align-items:center; justify-content:center; font-size:15px; color: var(--gold-deep); font-family:-apple-system, sans-serif;
  }
  .lightbox-close{
    position:absolute; top:-14px; right:-14px; width:34px; height:34px; border-radius:50%;
    background:#fff; color: var(--espresso); font-size:15px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow: var(--shadow);
  }
  .lightbox-nav{
    display:flex; justify-content:space-between; margin-top:14px;
  }
  .lightbox-nav button{
    font-family:-apple-system, sans-serif; font-size:12.5px; font-weight:600; color:#fff;
    background: rgba(255,255,255,0.14); padding:8px 16px; border-radius:999px; cursor:pointer;
  }
  .lightbox-nav button[disabled]{ opacity:0.35; cursor:default; }

  .wm-message textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-family:inherit;
    font-size:13px; resize:vertical; min-height:70px; background:#fff; color: var(--espresso);
  }
  .wm-actions{ display:flex; gap:10px; margin-top:14px; }
  .wm-btn{
    flex:1; text-align:center; font-size:13px; font-weight:700; padding:12px; border-radius:9px;
  }
  .wm-btn.primary{ color:#fff; }
  .wm-btn.ghost{ background: var(--ivory-deep); color: var(--espresso-soft); }
  .wm-btn[disabled]{ opacity:0.5; pointer-events:none; }

  /* Booking calendar step */
  .wm-day-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px; }
  .wm-day{
    flex:none; width:58px; padding:10px 0; border-radius:12px; text-align:center; background:#fff;
    border:1px solid var(--line); cursor:pointer;
  }
  .wm-day .d-dow{ font-size:10px; color:#8a7c6c; text-transform:uppercase; }
  .wm-day .d-num{ font-size:16px; font-weight:700; margin-top:2px; }
  .wm-day.active{ color:#fff; border-color:transparent; }
  .wm-hours{ display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:18px; }
  .wm-hour{
    padding:10px 0; text-align:center; border-radius:9px; font-size:12.5px; font-weight:600;
    background:#fff; border:1px solid var(--line); color: var(--espresso-soft); cursor:pointer;
  }
  .wm-hour.taken{ background: var(--ivory-deep); color:#b7a998; text-decoration:line-through; cursor:not-allowed; }
  .wm-hour.active{ color:#fff; border-color:transparent; }

  .wm-chat{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
  .wm-bubble{ max-width:80%; padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.5; }
  .wm-bubble.me{ align-self:flex-end; background: var(--espresso); color: var(--ivory); border-bottom-right-radius:4px; }
  .wm-bubble.them{ align-self:flex-start; background: var(--ivory-deep); color: var(--espresso); border-bottom-left-radius:4px; }

  .menu-panel{

  }
  .menu-panel a:hover{ background: var(--ivory-deep); }

</style>

<body>

  <header class="topbar">
    <div class="brand">@<b>MySalon</b></div>
    <div class="topbar-right">
      <a class="back-link sans" href="salons.html">← Back to Salons</a>

      <a href="about.html">About Us</a>
      <div class="menu-divider"></div>
      <a href="salons.html">Salons</a>
      <a href="specialists.html">Specialists</a>

  <div id="page"></div>

  </div>

  <div class="modal-overlay" id="chairModalOverlay">

  </div>

  <div class="lightbox-overlay" id="lightboxOverlay">
    <div class="lightbox-box">
      <div class="lightbox-close" id="lightboxClose">✕</div>
      <div class="lightbox-photo" id="lightboxPhoto"></div>
      <div class="lightbox-nav">
        <button type="button" id="lightboxPrev">← Previous</button>
        <button type="button" id="lightboxNext">Next →</button>
      </div>
    </div>
  </div>

  <button class="palette-fab" id="paletteFab" type="button" title="Customize your business colour">🎨</button>
  <div class="palette-panel" id="palettePanel">
    <div class="p-label">Business colour</div>
    <div class="p-sub">Owner-only — matches this to your own brand palette.</div>
    <div class="palette-swatches" id="paletteSwatches"></div>
    <div class="palette-custom-row">
      <input type="color" id="paletteCustomInput">
      <span style="font-size:11.5px; color:#6b5d4f;">Custom colour</span>
    </div>
    <button type="button" class="palette-reset" id="paletteResetBtn">Reset to default</button>
  </div>

  <footer>© 2026 @MySalon. All rights reserved.</footer>

  <script>
    // Each salon owner controls: template layout, background (color / photo / logo), accent color,
    // heading font and their own headline wording. Visitors on our side just see the finished page —
    // in the real product this would come from a "customize your page" screen in the salon's dashboard.
    const SALONS = {
      'the-gold-chair':        { name:'The Gold Chair', area:'Sandton',   rating:4.9, reviews:212, tags:['Barbers','Fades'], tier:'standard',
        theme:{ template:'bold', bg:'photo', accent:'#7A1F2A', accentDark:'#4A1119', font:'elegant', headline:'Fresh fades, sharp lines.' } },
      'mua-studio-sandton':    { name:'MUA Studio Sandton', area:'Sandton', rating:5.0, reviews:118, tags:['Makeup','Bridal'], tier:'premium',
        theme:{ template:'minimal', bg:'gradient', accent:'#D63C7A', accentDark:'#8C2350', font:'modern', headline:'Glow like you mean it.' } },
      'velvet-and-vine':       { name:'Velvet & Vine', area:'Rosebank', rating:4.8, reviews:164, tags:['Braids','Locs'], tier:'standard',
        theme:{ template:'classic', bg:'gradient', accent:'#B8794A', accentDark:'#7A4E2C', font:'default', headline:'Braids, done beautifully.' } },
      'nail-bar-rosebank':     { name:'Nail Bar Rosebank', area:'Rosebank', rating:4.8, reviews:141, tags:['Nails','Gel'], tier:'standard',
        theme:{ template:'bold', bg:'gradient', accent:'#D97B56', accentDark:'#A9502F', font:'modern', headline:'Nails that turn heads.' } },
      'the-colour-bar':        { name:'The Colour Bar', area:'Centurion', rating:4.7, reviews:98, tags:['Colors','Balayage'], tier:'premium',
        theme:{ template:'minimal', bg:'logo', accent:'#7B5EA7', accentDark:'#4E3A70', font:'elegant', headline:'Colour, perfected.' } },
      'curl-and-co-studio':    { name:'Curl & Co Studio', area:'Centurion', rating:4.6, reviews:73, tags:['Braids','Twists'], tier:'standard',
        theme:{ template:'classic', bg:'gradient', accent:'#8a5a3c', accentDark:'#5C3A26', font:'default', headline:'Twists and curls, loved.' } },
      'wig-studio-menlyn':     { name:'Wig Studio Menlyn', area:'Menlyn', rating:4.6, reviews:59, tags:['Wigs','Installs'], tier:'standard',
        theme:{ template:'bold', bg:'photo', accent:'#C98A8A', accentDark:'#8C5252', font:'modern', headline:'Your crown, installed.' } },
      'serenity-massage':      { name:'Serenity Massage', area:'Menlyn', rating:4.9, reviews:132, tags:['Massage','Spa'], tier:'premium',
        theme:{ template:'minimal', bg:'gradient', accent:'#7C9070', accentDark:'#4E5F44', font:'elegant', headline:'Breathe. Release. Restore.' } },
      'the-ritual-spa':        { name:'The Ritual Spa', area:'Hatfield', rating:4.9, reviews:87, tags:['Spa','Massage'], tier:'premium',
        theme:{ template:'bold', bg:'photo', accent:'#6E8B8B', accentDark:'#425757', font:'elegant', headline:'A ritual worth repeating.' } },
      'studio-hatfield':       { name:'Studio Hatfield', area:'Hatfield', rating:4.7, reviews:176, tags:['Facials','Wigs'], tier:'premium',
        theme:{ template:'classic', bg:'gradient', accent:'#5E8C86', accentDark:'#365550', font:'default', headline:'Facials, wigs, and more.' } },
      'midrand-beauty-bar':    { name:'Midrand Beauty Bar', area:'Midrand', rating:4.9, reviews:203, tags:['Makeup','Facials'], tier:'premium',
        theme:{ template:'minimal', bg:'logo', accent:'#A23B4E', accentDark:'#661F2C', font:'modern', headline:'Beauty, elevated.' } },
      'glow-and-co-beauty-bar':{ name:'Glow & Co Beauty Bar', area:'Midrand', rating:4.5, reviews:44, tags:['Nails','Facials'], tier:'standard',
        theme:{ template:'classic', bg:'gradient', accent:'#D97B56', accentDark:'#A9502F', font:'default', headline:'Glow from every angle.' } },
      'quick-cuts-midrand':    { name:'Quick Cuts Midrand', area:'Midrand', rating:3.6, reviews:52, tags:['Barbers','Fades'], tier:'standard',
        theme:{ template:'bold', bg:'gradient', accent:'#7A1F2A', accentDark:'#4A1119', font:'elegant', headline:'Fast, clean cuts.' } },
      'express-nails-centurion':{ name:'Express Nails Centurion', area:'Centurion', rating:3.9, reviews:37, tags:['Nails','Gel'], tier:'standard',
        theme:{ template:'bold', bg:'gradient', accent:'#D97B56', accentDark:'#A9502F', font:'modern', headline:'Nails on the go.' } },
      'city-barber-rosebank':  { name:'City Barber Rosebank', area:'Rosebank', rating:2.8, reviews:21, tags:['Barbers'], tier:'standard',
        theme:{ template:'classic', bg:'gradient', accent:'#7A1F2A', accentDark:'#4A1119', font:'default', headline:'No-frills barbering.' } },
      'budget-braids-hatfield':{ name:'Budget Braids Hatfield', area:'Hatfield', rating:2.1, reviews:14, tags:['Braids'], tier:'standard',
        theme:{ template:'classic', bg:'gradient', accent:'#8a5a3c', accentDark:'#5C3A26', font:'default', headline:'Affordable braiding.' } }
    };

    const TIER_INFO = {
      standard: { label: 'Standard tier', seats: 4, desc:'Up to 4 team members', photos: 2 },
      premium:  { label: 'Premium tier', seats: 8, desc:'Up to 8+ team members · Rent-a-Chair enabled', photos: 4 }
    };

    const FIRST_NAMES = ['Thabo','Naledi','Kagiso','Palesa','Sipho','Lerato','Boitumelo','Karabo','Nomvula','Tumi','Andile','Zanele','Bongani','Ayanda','Mpho','Refilwe','Lungile','Kabelo'];
    const LAST_INITIALS = ['M','N','D','K','T','S','P','R','V','H'];

    // Rough price bands per service tag, used to generate each specialist's catalog
    const PRICE_MAP = {
      Barbers:[120,180], Fades:[120,180], Braids:[350,650], Locs:[350,650], Twists:[350,600], Installs:[400,700],
      Wigs:[400,700], Colors:[450,900], Balayage:[500,900], Nails:[180,320], Gel:[180,320],
      Massage:[320,550], Spa:[320,550], Makeup:[350,900], Bridal:[500,1200], Facials:[280,480]
    };

    // The full salon menu — every line item offered under each of the salon's specialties
    const SERVICE_CATALOG = {
      Barbers: [ ['Skin Fade',120], ['Line-Up',60], ['Beard Trim',80], ['Hot Towel Shave',150], ["Kids' Cut",90] ],
      Fades:   [ ['Skin Fade',120], ['Taper Fade',130], ['Bald Fade + Design',180], ['Beard Fade',100] ],
      Braids:  [ ['Box Braids',450], ['Knotless Braids',650], ['Cornrows',350], ["Kids' Braids",250] ],
      Locs:    [ ['Starter Locs',550], ['Retwist',300], ['Loc Maintenance',250] ],
      Twists:  [ ['Senegalese Twists',500], ['Passion Twists',550], ['Twist-Out Styling',300] ],
      Installs:[ ['Wig Install (Glueless)',400], ['Wig Install (Lace, Bleached)',700], ['Frontal Install',650] ],
      Wigs:    [ ['Wig Unit Styling',350], ['Wig Wash & Restyle',300], ['Custom Wig Install',700] ],
      Colors:  [ ['Full Colour',500], ['Root Touch-Up',350], ['Highlights',600] ],
      Balayage:[ ['Balayage',750], ['Balayage + Toner',900], ['Colour Correction',1200] ],
      Nails:   [ ['Classic Manicure',180], ['Classic Pedicure',220], ['Acrylic Full Set',350], ['Acrylic Fill',250] ],
      Gel:     [ ['Gel Manicure',220], ['Gel Overlay',280], ['Gel + Nail Art',320] ],
      Massage: [ ['Swedish Massage (60 min)',380], ['Deep Tissue Massage (60 min)',450], ['Hot Stone Massage',550] ],
      Spa:     [ ['Full Body Spa Package',900], ['Couples Spa Package',1600], ['Express Facial + Massage',650] ],
      Makeup:  [ ['Everyday Makeup',350], ['Glam Makeup',500], ['Makeup Lesson',400] ],
      Bridal:  [ ['Bridal Makeup (Trial)',600], ['Bridal Makeup (Day-Of)',1200], ['Bridal Party (per person)',450] ],
      Facials: [ ['Signature Facial',320], ['Deep Cleanse Facial',380], ['Anti-Aging Facial',480] ]
    };

    function hashStr(s){
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return h;
    }

    // Salons that also list a spare chair for rent on the Rent a Chair page — same weekly
    // prices shown there. Only salons in this map get the "Rent a Chair here" banner below.
    const CHAIR_LISTINGS = {
      'the-gold-chair': 650, 'mua-studio-sandton': 900, 'studio-hatfield': 550, 'the-ritual-spa': 1200,
      'midrand-beauty-bar': 450, 'velvet-and-vine': 700, 'the-colour-bar': 500, 'serenity-massage': 800,
      'curl-and-co-studio': 400, 'nail-bar-rosebank': 350
    };
    const CHAIR_PERK_POOL = ['Basin access','Backwash included','Storage locker','Free wifi','High foot traffic','Walk-in clients','Reception support','Product display space','Treatment room','Natural light'];
    function chairPerksFor(slug){
      const seed = hashStr(slug);
      const count = 3 + (seed % 2);
      const picked = [];
      for (let i = 0; i < count; i++) picked.push(CHAIR_PERK_POOL[(seed + i * 7) % CHAIR_PERK_POOL.length]);
      return [...new Set(picked)];
    }
    function chairBannerHtml(slug, salon){
      if (!(slug in CHAIR_LISTINGS)) return '';
      const price = CHAIR_LISTINGS[slug];
      return `
        <div class="chair-banner">
          <div class="chair-banner-inner">
            <div>
              <h4>Rent a chair at ${salon.name}</h4>
              <div class="sub">${chairPerksFor(slug).join(' · ')}</div>
              <div class="price">R${price} / week</div>
            </div>
            <button class="chair-btn" id="chairRentBtn" type="button">Rent this chair</button>
          </div>
        </div>`;
    }

    // Premium-tier perk: the salon owner can pick each worker's cover-photo color from the
    // salon's own brand palette (built from their theme's accent colors), rather than one fixed banner.
    function lightenColor(hex, amt){
      const c = hex.replace('#', '');
      const num = parseInt(c, 16);
      let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
      r = Math.round(r + (255 - r) * amt);
      g = Math.round(g + (255 - g) * amt);
      b = Math.round(b + (255 - b) * amt);
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }
    function paletteFor(salon){
      return [salon.theme.accent, salon.theme.accentDark, lightenColor(salon.theme.accent, 0.35), '#C9A961'];
    }
    function coverBandHtml(w, salon){
      if (salon.tier !== 'premium' || !w.coverColor) return '';
      return `<div class="wm-cover" style="background:${w.coverColor};" title="Cover photo — picked from ${salon.name}'s brand palette"></div>`;
    }
    function workerAvatarHtml(w, salon){
      if (salon.tier === 'premium'){
        return `<div class="wm-avatar wm-avatar-photo">${initials(w.name)}<span class="wm-avatar-cam">📷</span></div>`;
      }
      return `<div class="wm-avatar">${initials(w.name)}</div>`;
    }

    function initials(name){
      return name.replace(/&/g, ' ').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    }

    // Builds the hero exactly the way that salon's owner has customized it —
    // template layout + background (color / photo / logo) + accent + font + their own wording.
    function heroHtml(salon, info){
      const t = salon.theme;
      const bgStyle = t.bg === 'logo'
        ? (t.template === 'minimal' ? '' : `background:${t.accentDark};`)
        : `background: linear-gradient(135deg, ${t.accent}, ${t.accentDark});`;
      const photoFlag = t.bg === 'photo' ? '<span class="photo-flag">📷 Cover photo</span>' : '';
      const tierStyle = `style="background:rgba(255,255,255,0.16); border-color:rgba(255,255,255,0.3);"`;
      const bookStyle = `style="color:${t.accentDark};"`;

      const body = `
        <div class="hero-tier ${salon.tier}" ${t.template === 'minimal' ? '' : tierStyle}>${info.label} · ${info.desc}</div>
        <h1>${salon.name}</h1>
        <div class="hero-tagline">${t.headline}</div>
        <div class="hero-meta sans"><span class="stars">★ ${salon.rating}</span> (${salon.reviews} reviews) · ${salon.area}</div>
        <div class="hero-tags">${salon.tags.map(tag => `<span class="hero-tag">${tag}</span>`).join('')}</div>
      `;

      const logoBadge = `<div class="hero-logo-badge" style="background:${t.accent};">${initials(salon.name)}</div>`;

      let inner;
      if (t.template === 'minimal'){
        inner = `
          <div class="hero-top" style="align-items:center; flex-direction:column; text-align:center;">
            ${t.bg === 'logo' ? logoBadge : ''}
            <div>${body}</div>
          </div>
          <div style="text-align:center; margin-top:8px;">
            <a href="#" class="hero-book" data-open="salon-book" style="background:${t.accent}; color:#fff;">Book at ${salon.name}</a>
          </div>
        `;
      } else if (t.template === 'bold'){
        inner = `
          <div class="hero-top">
            <div>${t.bg === 'logo' ? logoBadge : ''}${body}</div>
          </div>
          <div style="margin-top:10px;">
            <a href="#" class="hero-book" data-open="salon-book" ${bookStyle}>Book at ${salon.name}</a>
          </div>
        `;
      } else {
        inner = `
          <div class="hero-top">
            <div>${body}</div>
            <a href="#" class="hero-book" data-open="salon-book" ${bookStyle}>Book at ${salon.name}</a>
          </div>
        `;
      }

      return `
        <section class="hero tpl-${t.template} font-${t.font}" style="${t.template === 'minimal' ? '' : bgStyle}">
          ${photoFlag}
          <div class="hero-inner">
            ${inner}
            ${salon.tier === 'premium' ? `
              <div class="rent-chair-note">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h9l3 3v13H6z"/><path d="M9 4v13"/></svg>
                This salon's plan includes Rent-a-Chair — spare chairs may be listed for independent specialists.
              </div>` : ''}
          </div>
        </section>
      `;
    }

    function priceFor(tag, seed){
      const range = PRICE_MAP[tag] || [200, 400];
      const val = range[0] + (seed % (range[1] - range[0] + 1));
      return Math.round(val / 10) * 10;
    }

    function staffFor(slug, salon){
      const info = TIER_INFO[salon.tier];
      const seed = hashStr(slug);
      const staff = [];
      for (let i = 0; i < info.seats; i++){
        const ni = (seed + i * 7) % FIRST_NAMES.length;
        const li = (seed + i * 13) % LAST_INITIALS.length;
        const name = FIRST_NAMES[ni] + ' ' + LAST_INITIALS[li] + '.';
        const primaryTag = salon.tags[i % salon.tags.length];
        const secondaryTag = salon.tags[(i + 1) % salon.tags.length];
        const role = primaryTag + ' Specialist';
        const working = ((seed + i * 5) % 3) !== 0; // deterministic per salon, ~2 in 3 working today
        const services = [
          { name: primaryTag, price: priceFor(primaryTag, seed + i * 3) },
          { name: secondaryTag + ' Add-on', price: priceFor(secondaryTag, seed + i * 9) }
        ];
        const coverColor = salon.tier === 'premium' ? paletteFor(salon)[i % 4] : null;
        staff.push({ name, role, working, services, photos: salon.tier === 'premium' ? 8 : 4, coverColor });
      }
      return staff;
    }

    // Premium-tier perk: the salon gets its own 8-photo exhibition, separate from each worker's own portfolio.
    function exhibitionHtml(salon){
      if (salon.tier !== 'premium') return '';
      const accent = salon.theme.accent, accentDark = salon.theme.accentDark;
      return `
        <section class="exhibit-section">
          <div class="exhibit-head">
            <h2>Inside <span style="color:${accent}; font-style:italic;">${salon.name}</span></h2>
            <span class="tier-chip">★ Premium perk</span>
          </div>
          <div class="exhibit-sub">The salon's own exhibition — separate from each specialist's personal portfolio.</div>
          <div class="exhibit-grid">
            ${Array.from({ length: 8 }).map((_, i) => `
              <div class="exhibit-photo" style="background:linear-gradient(${135 + i * 12}deg, ${accent}33, ${accentDark}55);">Photo ${i + 1}</div>
            `).join('')}
          </div>
        </section>`;
    }

    function render(){
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('salon');
      const salon = slug && SALONS[slug];
      const page = document.getElementById('page');

      if (!salon){
        page.innerHTML = `
          <div class="not-found">
            <h2>We couldn't find that salon</h2>
            <p>It may have been renamed or removed. <a href="salons.html">Back to all salons →</a></p>
          </div>`;
        document.title = 'Salon not found — @MySalon';
        return;
      }

      document.title = salon.name + ' — @MySalon';
      const info = TIER_INFO[salon.tier];
      const staff = staffFor(slug, salon);

      currentSalon = salon;
      currentSlug = slug;
      currentStaff = staff;

      page.innerHTML = `
        ${heroHtml(salon, info)}

        ${chairBannerHtml(slug, salon)}

        <section class="menu-section">
          <div class="menu-head">
            <h2>Menu <span>&amp; pricing</span></h2>
          </div>
          <div class="menu-sub sans">Everything on offer at ${salon.name}. Ask your specialist about add-ons when you book.</div>
          <div class="menu-groups">
            ${salon.tags.map(tag => `
              <div class="menu-group">
                <h3 style="color:${salon.theme.accent};">${tag}</h3>
                ${(SERVICE_CATALOG[tag] || []).map(([itemName, price]) => `
                  <div class="menu-item">
                    <span class="m-name">${itemName}</span>
                    <span class="menu-price">R${price}</span>
                  </div>
                `).join('')}
              </div>
            `).join('')}
          </div>
        </section>

        ${exhibitionHtml(salon)}

        <section class="staff-section">
          <div class="staff-head">
            <h2>Who's working <span>today</span></h2>
          </div>
          <div class="staff-sub sans">${info.seats} team slot${info.seats === 1 ? '' : 's'} on the ${info.label.toLowerCase()} — tap an available specialist to book with them directly.</div>
          <div class="staff-grid">
            ${staff.map((w, i) => `
              <div class="staff-card" data-idx="${i}">
                <div class="staff-top">
                  <div class="staff-avatar">Photo</div>
                  <div class="staff-id">
                    <h4>${w.name}</h4>
                    <div class="staff-role sans">${w.role}</div>
                    <div class="staff-status ${w.working ? 'working' : 'off'} sans">
                      <span class="dot"></span>${w.working ? 'Working today' : 'Off today'}
                    </div>
                  </div>
                </div>
                <div class="staff-services">
                  ${w.services.map(s => `<div class="svc-row"><span>${s.name}</span><span class="svc-price">R${s.price}</span></div>`).join('')}
                </div>
                <div class="staff-portfolio-label">Catalog</div>
                <div class="staff-portfolio photos-${w.photos}">
                  ${Array.from({ length: w.photos }).map(() => '<div class="pf-thumb">Photo</div>').join('')}
                </div>
                <a href="#" class="staff-btn ${w.working ? '' : 'disabled'}" data-idx="${i}" ${w.working ? `style="background:${salon.theme.accent}; color:#fff;"` : ''}>${w.working ? 'Book ' + w.name.split(' ')[0] : 'Unavailable'}</a>
              </div>

    async function loadChairSlot(slug){
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/chair_slots?salon_slug=eq.${encodeURIComponent(slug)}&select=*`, {
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        if (!res.ok) return null;
        const rows = await res.json();
        if (!rows.length) return null;
        const row = rows[0];
        const wp = Array.isArray(row.work_photos) ? row.work_photos.slice(0, 4) : [];
        while (wp.length < 4) wp.push(null);
        return { name: row.name || '', profilePhoto: row.profile_photo || null, workPhotos: wp, specialties: Array.isArray(row.specialties) ? row.specialties : [] };
      } catch (e){
        return null; // offline / unreachable — the page still works, just without the saved slot
      }
    }

            'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal'
          },
