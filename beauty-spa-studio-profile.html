<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spa Studio — @MySalon</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FAF6F0; --ivory-deep:#F1E9DD; --espresso:#241E1A; --espresso-soft:#3A322C;
    --gold:#C9A961; --gold-deep:#A9863F; --blush:#D9AFA6; --line:#E6DCCB; --white:#FFFFFF;
    --shadow: 0 20px 40px -20px rgba(36,30,26,0.35);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:"Georgia", serif; background:var(--ivory); color:var(--espresso); -webkit-font-smoothing:antialiased; }
  .sans{ font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 32px; background: var(--espresso); color: var(--ivory);
  }
  .brand{ font-size: 22px; }
  .brand b{ color: var(--gold); font-weight:600; }
  .back-link{ font-family:-apple-system, sans-serif; font-size:13px; color: var(--gold); }

  .not-found{ max-width:600px; margin:80px auto; text-align:center; font-family:-apple-system, sans-serif; }
  .not-found a{ color: var(--maroon); font-weight:600; }

  /* ---------- Hero (studio's own theme: template / bg / accent / font / headline) ---------- */
  .hero{ padding: 54px 32px 46px; color:#fff; position:relative; overflow:hidden; }
  .hero-inner{ max-width:1180px; margin:0 auto; position:relative; z-index:1; padding-top:26px; }
  .hero-top{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; }
  .hero-logo{
    width:72px; height:72px; border-radius:16px; background: rgba(255,255,255,0.16);
    display:flex; align-items:center; justify-content:center; font-family:-apple-system, sans-serif;
    font-weight:700; font-size:22px; margin-bottom:14px; border:2px solid rgba(255,255,255,0.7);
  }
  .hero-cover{ position:absolute; top:0; left:0; right:0; height:70px; opacity:0.9; }
  .hero .eyebrow{ font-family:-apple-system, sans-serif; text-transform:uppercase; letter-spacing:3px; font-size:11px; opacity:0.85; margin-bottom:8px; }
  .hero h1{ font-size:36px; font-weight:400; margin-bottom:8px; }
  .hero .hero-meta{ font-family:-apple-system, sans-serif; font-size:13px; opacity:0.9; margin-bottom:16px; }
  .hero .hero-meta .stars{ color:#FFE7A8; }
  .hero-tags{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .hero-tag{
    font-family:-apple-system, sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px;
    background: rgba(255,255,255,0.16); padding:5px 12px; border-radius:999px;
  }
  .hero-book{
    display:inline-block; font-family:-apple-system, sans-serif; font-size:14px; font-weight:700;
    background:#fff; padding:13px 26px; border-radius:999px; box-shadow: var(--shadow);
  }
  .hero .format-chip{
    font-family:-apple-system, sans-serif; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.5px; color:#fff; background: rgba(0,0,0,0.28);
    padding:5px 12px; border-radius:999px; display:inline-block; margin-bottom:12px;
  }
  .font-elegant, .font-elegant h1{ font-family:'Playfair Display', Georgia, serif; }
  .font-modern, .font-modern h1{ font-family:'Poppins', -apple-system, sans-serif; font-weight:700; }

  /* ---------- Studio exhibition ---------- */
  .exhibit-section{ max-width:1180px; margin:0 auto; padding: 40px 32px 8px; }
  .exhibit-head{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .exhibit-head h2{ font-size:26px; font-weight:400; }
  .exhibit-sub{ font-family:-apple-system, sans-serif; font-size:13px; color:#8a7c6c; margin: 4px 0 18px; }
  .exhibit-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; }
  .exhibit-photo{
    aspect-ratio:1/1; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, sans-serif; font-size:11px; color:rgba(0,0,0,0.45); cursor:zoom-in;
  }
  @media (max-width: 700px){ .exhibit-grid{ grid-template-columns: repeat(2, 1fr); } }

  /* ---------- Menu & pricing ---------- */
  .menu-section{ max-width:1180px; margin:0 auto; padding: 40px 32px 8px; }
  .menu-head h2{ font-size:26px; font-weight:400; margin-bottom:6px; }
  .menu-head h2 span{ font-style:italic; color: var(--gold-deep); }
  .menu-sub{ font-family:-apple-system, sans-serif; font-size:13px; color:#8a7c6c; margin-bottom:22px; }
  .menu-groups{ display:grid; grid-template-columns: repeat(2, 1fr); gap:28px 40px; }
  .menu-group h3{ font-size:17px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .menu-item{ display:flex; justify-content:space-between; padding:7px 0; font-family:-apple-system, sans-serif; font-size:13.5px; }
  .menu-price{ color: var(--gold-deep); font-weight:700; }
  @media (max-width: 700px){ .menu-groups{ grid-template-columns: 1fr; } }

  /* ---------- Staff ---------- */
  .staff-section{ max-width:1180px; margin:0 auto; padding: 40px 32px 60px; }
  .staff-head h2{ font-size:26px; font-weight:400; margin-bottom:6px; }
  .staff-head h2 span{ font-style:italic; color: var(--gold-deep); }
  .staff-sub{ font-family:-apple-system, sans-serif; font-size:13px; color:#8a7c6c; margin-bottom:22px; }
  .staff-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:20px; }
  .staff-card{ background: var(--white); border:1px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer; transition: box-shadow .2s ease, transform .2s ease; }
  .staff-card:hover{ box-shadow: var(--shadow); transform: translateY(-2px); }
  .staff-top{ display:flex; gap:14px; padding:18px; align-items:center; }
  .staff-avatar{
    width:56px; height:56px; border-radius:50%; flex:none; position:relative;
    background: rgba(0,0,0,0.06); display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, sans-serif; font-weight:700; font-size:16px; color: var(--espresso-soft);
    border:2px solid var(--line);
  }
  .staff-avatar-cam{
    position:absolute; bottom:-2px; right:-2px; width:18px; height:18px; border-radius:50%;
    background:#fff; color:#5A4E3E; font-size:9px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.3);
  }
  .staff-id h4{ font-size:15.5px; margin-bottom:2px; }
  .staff-role{ font-family:-apple-system, sans-serif; font-size:12px; color:#8a7c6c; margin-bottom:4px; }
  .staff-status{ font-family:-apple-system, sans-serif; font-size:11px; font-weight:700; display:inline-flex; align-items:center; gap:5px; }
  .staff-status.working{ color:#3E7D4C; }
  .staff-status.off{ color:#a89a86; }
  .staff-status .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .staff-portfolio-label{ font-family:-apple-system, sans-serif; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#a89a86; padding: 0 18px 6px; }
  .staff-portfolio{ display:grid; grid-template-columns: repeat(4, 1fr); gap:6px; padding:0 18px 18px; }
  .pf-thumb{ aspect-ratio:1/1; border-radius:8px; background: rgba(0,0,0,0.05); display:flex; align-items:center; justify-content:center; font-size:9px; color:#a89a86; font-family:-apple-system, sans-serif; }
  @media (max-width: 700px){ .staff-grid{ grid-template-columns: 1fr; } }

  /* ---------- Modal (booking) ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,15,12,0.6); z-index:100; display:none;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:#fff; border-radius:18px; width:min(460px, 100%); max-height:88vh; overflow-y:auto;
    box-shadow: var(--shadow); position:relative;
  }
  .modal-close{
    position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%;
    background: rgba(255,255,255,0.25); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:14px; z-index:3;
  }
  .wm-hero{ padding:64px 26px 20px; color:#fff; border-radius:18px 18px 0 0; position:relative; overflow:hidden; }
  .wm-hero .wm-avatar{
    width:72px; height:72px; border-radius:50%; background: rgba(255,255,255,0.14);
    display:flex; align-items:center; justify-content:center; font-family:-apple-system, sans-serif;
    font-weight:700; font-size:20px; margin-bottom:12px; position:relative;
    border:3px solid rgba(255,255,255,0.85); box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }
  .wm-hero .wm-cover{ position:absolute; top:0; left:0; right:0; height:56px; opacity:0.9; }
  .wm-hero .wm-avatar-cam{
    position:absolute; bottom:-2px; right:-2px; width:20px; height:20px; border-radius:50%;
    background:#fff; color:#5A4E3E; font-size:10px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.3);
  }
  .wm-hero h3{ font-size:21px; margin-bottom:4px; }
  .wm-hero .wm-role{ font-family:-apple-system, sans-serif; font-size:12.5px; opacity:0.85; }
  .wm-body{ padding:22px 26px 26px; font-family:-apple-system, sans-serif; }
  .wm-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#a89a86; margin-bottom:10px; }
  .wm-services{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; }
  .wm-svc-row b{ color: var(--gold-deep); }
  .wm-portfolio{ display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-bottom:22px; }
  .wm-photo{
    aspect-ratio:1/1; border-radius:10px; background: linear-gradient(135deg, var(--ivory-deep), var(--blush));
    display:flex; align-items:center; justify-content:center; font-size:10px; color: var(--gold-deep); cursor:zoom-in;
  }
  .wm-message textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-family:inherit;
    font-size:13px; resize:vertical; min-height:70px; background:#fff; color: var(--espresso);
  }
  .wm-actions{ display:flex; gap:10px; margin-top:14px; }
  .wm-btn{ font-family:-apple-system, sans-serif; font-size:13px; font-weight:700; padding:11px 18px; border-radius:999px; flex:1; text-align:center; }
  .wm-btn.primary{ color:#fff; }
  .wm-btn.ghost{ border:1px solid var(--line); color: var(--espresso-soft); background:#fff; flex:none; }
  .wm-btn[disabled]{ opacity:0.5; cursor:default; }
  .wm-day-row{ display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; }
  .wm-day{ flex:none; width:52px; padding:10px 0; text-align:center; border-radius:12px; border:1px solid var(--line); cursor:pointer; transition: background .15s ease; }
  .wm-day .d-dow{ font-size:10.5px; color:#8a7c6c; text-transform:uppercase; }
  .wm-day .d-num{ font-size:16px; font-weight:700; }
  .wm-day.active{ color:#fff; border-color:transparent; }
  .wm-day.active .d-dow{ color: rgba(255,255,255,0.85); }
  .wm-hours{ display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:18px; }
  .wm-hour{ text-align:center; padding:10px 0; border-radius:10px; border:1px solid var(--line); font-size:13px; cursor:pointer; }
  .wm-hour.taken{ opacity:0.35; text-decoration:line-through; cursor:default; background: var(--ivory-deep); }
  .wm-hour.active{ color:#fff; border-color:transparent; }
  .wm-chat{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
  .wm-bubble{ max-width:80%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.4; }
  .wm-bubble.me{ align-self:flex-end; background: var(--ivory-deep); color: var(--espresso); border-bottom-right-radius:4px; }
  .wm-bubble.them{ align-self:flex-start; background: var(--espresso); color:#fff; border-bottom-left-radius:4px; }
  .wm-typing{ align-self:flex-start; font-size:12px; color:#a89a86; font-style:italic; }
  .wm-proto-note{ font-size:11px; color:#a89a86; margin-top:10px; font-style:italic; }
  .wm-follow-row{ display:flex; gap:8px; margin-top:14px; }
  .wm-follow-row input{ flex:1; border:1px solid var(--line); border-radius:999px; padding:10px 16px; font-family:inherit; font-size:13px; }
  .wm-follow-row button{ font-family:-apple-system, sans-serif; font-size:13px; font-weight:700; color:#fff; padding:10px 18px; border-radius:999px; }

  /* ---------- Lightbox ---------- */
  .lightbox-overlay{ position:fixed; inset:0; background:rgba(20,15,12,0.85); z-index:200; display:none; align-items:center; justify-content:center; padding:24px; }
  .lightbox-overlay.open{ display:flex; }
  .lightbox-box{ position:relative; width:min(520px, 92vw); }
  .lightbox-photo{
    width:100%; aspect-ratio:4/3; border-radius:16px; background: linear-gradient(135deg, var(--ivory-deep), var(--blush));
    display:flex; align-items:center; justify-content:center; font-size:15px; color: var(--gold-deep); font-family:-apple-system, sans-serif;
  }
  .lightbox-close{
    position:absolute; top:-14px; right:-14px; width:34px; height:34px; border-radius:50%;
    background:#fff; color: var(--espresso); font-size:15px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow: var(--shadow);
  }
  .lightbox-nav{ display:flex; justify-content:space-between; margin-top:14px; }
  .lightbox-nav button{
    font-family:-apple-system, sans-serif; font-size:12.5px; font-weight:600; color:#fff;
    background: rgba(255,255,255,0.14); padding:8px 16px; border-radius:999px; cursor:pointer;
  }
  .lightbox-nav button[disabled]{ opacity:0.35; cursor:default; }

  footer{ background: var(--espresso); color: rgba(250,246,240,0.6); text-align:center; padding: 28px; font-family:-apple-system, sans-serif; font-size:12px; margin-top:20px; }

  /* ---------- Palette customizer — the business owner's own colour, applied live ---------- */
  .palette-fab{
    position:fixed; bottom:24px; right:24px; z-index:150; width:52px; height:52px; border-radius:50%;
    background: var(--espresso); color: var(--gold); font-size:20px; display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow); cursor:pointer; border:none;
  }
  .palette-panel{
    position:fixed; bottom:88px; right:24px; z-index:150; width:250px; background:#fff; border-radius:16px;
    box-shadow: var(--shadow); padding:16px; display:none; font-family:-apple-system, sans-serif;
  }
  .palette-panel.open{ display:block; }
  .palette-panel .p-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:#8a7c6c; margin-bottom:2px; }
  .palette-panel .p-sub{ font-size:11px; color:#a89a86; margin-bottom:10px; }
  .palette-swatches{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:12px; }
  .palette-swatch{ width:28px; height:28px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0; }
  .palette-custom-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .palette-custom-row input[type=color]{ width:34px; height:34px; border:none; border-radius:8px; padding:0; background:none; cursor:pointer; }
  .palette-reset{ font-size:11.5px; color:#8a7c6c; text-decoration:underline; background:none; border:none; cursor:pointer; }

  .topbar{ position:relative; }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .icon-btn{
    width:46px; height:46px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .icon-btn:hover{ background: rgba(255,255,255,0.08); }
  .icon-btn svg{ width:21px; height:21px; }
  .burger{
    width:46px; height:46px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px;
    border-radius: 9px;
    position:relative;
  }
  .burger:hover{ background: rgba(255,255,255,0.08); }
  .burger span{ width:24px; height:2.5px; background: var(--ivory); display:block; border-radius:2px; }

  .menu-panel{
    position:absolute; top: 68px; right: 32px; z-index:70;
    background: var(--white); border-radius: 14px;
    box-shadow: var(--shadow); border:1px solid var(--line);
    min-width: 260px; padding: 10px;
    display:none; flex-direction:column; gap:2px;
  }
  .menu-panel.open{ display:flex; }
  .menu-panel a{
    font-family:-apple-system, sans-serif; font-size:15px; color: var(--espresso);
    padding: 13px 16px; border-radius: 9px;
  }
  .menu-panel a:hover{ background: var(--ivory-deep); }
  .menu-divider{ height:1px; background: var(--line); margin: 6px 4px; }
</style>
</head>

    <div class="brand">@<b>MySalon</b></div>
    <div class="topbar-right">
      <a class="back-link sans" href="beauty-spa.html">← Back to Beauty / Spa</a>

    <button type="button" class="palette-reset" id="paletteResetBtn">Reset to default</button>

  <footer>© 2026 @MySalon. All rights reserved.</footer>

  <script>
    // A spa studio is a mini-website too, same as a salon — the owner picks template, background,
    // accent color, font and headline. One tier here: 4 therapist slots, 8 photos each, plus the
    // studio's own 8-photo exhibition. Same price as booking an independent specialist.
    const STUDIOS = {
      'serenity-massage-studio': { name:'Serenity Massage Studio', area:'Menlyn', rating:4.9, reviews:210, tags:['Massage','Spa'],
        theme:{ template:'minimal', bg:'gradient', accent:'#7C9070', accentDark:'#4E5F44', font:'elegant', headline:'Breathe. Release. Restore.' } },
      'zen-den-spa': { name:'Zen Den Spa', area:'Sandton', rating:4.8, reviews:178, tags:['Aromatherapy','Spa'],
        theme:{ template:'bold', bg:'photo', accent:'#5E8C86', accentDark:'#365550', font:'elegant', headline:'A sensory escape, every visit.' } },
      'the-ritual-spa-house': { name:'The Ritual Spa House', area:'Hatfield', rating:4.9, reviews:196, tags:['Spa','Massage'],
        theme:{ template:'bold', bg:'photo', accent:'#6E8B8B', accentDark:'#425757', font:'elegant', headline:'A ritual worth repeating.' } },
      'harmony-wellness-studio': { name:'Harmony Wellness Studio', area:'Centurion', rating:4.7, reviews:151, tags:['Reflexology','Massage'],
        theme:{ template:'classic', bg:'gradient', accent:'#4E6B67', accentDark:'#2E403D', font:'default', headline:'Balance, restored by trained hands.' } },
      'midrand-spa-collective': { name:'Midrand Spa Collective', area:'Midrand', rating:3.8, reviews:33, tags:['Massage','Reflexology'],
        theme:{ template:'classic', bg:'gradient', accent:'#7C9070', accentDark:'#4E5F44', font:'default', headline:'Everyday wellness, close to home.' } }
    };

    const SERVICE_CATALOG = {
      Massage:      [ ['Swedish Massage (60 min)',380], ['Deep Tissue Massage (60 min)',450], ['Hot Stone Massage',550] ],
      Spa:          [ ['Full Body Spa Package',900], ['Couples Spa Package',1600], ['Express Facial + Massage',650] ],
      Reflexology:  [ ['Foot Reflexology (30 min)',220], ['Full Body Reflexology (60 min)',420], ['Reflexology + Aromatherapy Combo',520] ],
      Aromatherapy: [ ['Aromatherapy Massage',420], ['Essential Oil Ritual',480], ['Aromatherapy Facial',380] ]
    };

    const FIRST_NAMES = ['Ayanda','Thabo','Lerato','Naledi','Karabo','Palesa','Zanele','Sipho','Thandeka','Kagiso','Boitumelo','Mpho','Nomvula','Siyabonga','Refilwe','Itumeleng'];
    const LAST_INITIALS = ['M','N','D','V','S','K','R','T','Z','B','C','P'];

    function hashStr(s){
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return h;
    }
    function initials(name){
      return name.replace(/&/g, ' ').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
    }
    function lightenColor(hex, amt){
      const c = hex.replace('#', '');
      const num = parseInt(c, 16);
      let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
      r = Math.round(r + (255 - r) * amt);
      g = Math.round(g + (255 - g) * amt);
      b = Math.round(b + (255 - b) * amt);
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }
    function paletteFor(studio){
      return [studio.theme.accent, studio.theme.accentDark, lightenColor(studio.theme.accent, 0.35), '#C9A961'];
    }
    function priceFor(tag, seed){
      const items = SERVICE_CATALOG[tag] || [[tag, 300]];
      return items[seed % items.length][1];
    }

    function staffFor(slug, studio){
      const seed = hashStr(slug);
      const staff = [];
      for (let i = 0; i < 4; i++){
        const ni = (seed + i * 7) % FIRST_NAMES.length;
        const li = (seed + i * 13) % LAST_INITIALS.length;
        const name = FIRST_NAMES[ni] + ' ' + LAST_INITIALS[li] + '.';
        const primaryTag = studio.tags[i % studio.tags.length];
        const secondaryTag = studio.tags[(i + 1) % studio.tags.length];
        const role = primaryTag + ' Therapist';
        const working = ((seed + i * 5) % 3) !== 0;
        const services = [
          { name: primaryTag, price: priceFor(primaryTag, seed + i * 3) },
          { name: secondaryTag + ' Add-on', price: priceFor(secondaryTag, seed + i * 9) }
        ];
        const coverColor = paletteFor(studio)[i % 4];
        staff.push({ name, role, working, services, photos: 8, coverColor });
      }
      return staff;
    }

    function heroHtml(studio){
      const t = studio.theme;
      const coverColor = paletteFor(studio)[hashStr(studio.name) % 4];
      const bgStyle = `background: linear-gradient(135deg, ${t.accent}, ${t.accentDark});`;
      const logoBadge = t.bg === 'logo' ? `<div class="hero-logo" style="background:${t.accentDark};">${initials(studio.name)}</div>` : `<div class="hero-logo" style="background:rgba(255,255,255,0.16);">${initials(studio.name)}</div>`;
      return `
        <section class="hero font-${t.font}" style="${bgStyle}">
          <div class="hero-cover" style="background:${coverColor};"></div>
          <div class="hero-inner">
            <div class="hero-top">
              <div>
                <span class="format-chip">Studio</span><br>
                ${logoBadge}
                <div class="eyebrow">${studio.area} · Spa studio</div>
                <h1>${studio.name}</h1>
                <div class="hero-meta"><span class="stars">★ ${studio.rating}</span> (${studio.reviews} reviews)</div>
                <div class="sans" style="opacity:0.9; margin-bottom:14px; max-width:420px;">${t.headline}</div>
                <div class="hero-tags">${studio.tags.map(tag => `<span class="hero-tag">${tag}</span>`).join('')}</div>
              </div>
              <a href="#" class="hero-book" id="heroBookBtn" style="color:${t.accentDark};">Book at ${studio.name}</a>
            </div>
          </div>
        </section>`;
    }

    function exhibitionHtml(studio){
      const accent = studio.theme.accent, accentDark = studio.theme.accentDark;
      return `
        <section class="exhibit-section">
          <div class="exhibit-head">
            <h2>Inside <span style="color:${accent}; font-style:italic;">${studio.name}</span></h2>
          </div>
          <div class="exhibit-sub">The studio's own exhibition — separate from each therapist's personal portfolio.</div>
          <div class="exhibit-grid" id="exhibitGrid">
            ${Array.from({ length: 8 }).map((_, i) => `
              <div class="exhibit-photo" data-pi="${i}" style="background:linear-gradient(${135 + i * 12}deg, ${accent}33, ${accentDark}55);">Photo ${i + 1}</div>
            `).join('')}
          </div>
        </section>`;
    }

    function menuHtml(studio){
      return `
        <section class="menu-section">
          <div class="menu-head">
            <h2>Menu <span>&amp; pricing</span></h2>
          </div>
          <div class="menu-sub">Everything on offer at ${studio.name}. Ask your therapist about add-ons when you book.</div>
          <div class="menu-groups">
            ${studio.tags.map(tag => `
              <div class="menu-group">
                <h3 style="color:${studio.theme.accent};">${tag}</h3>
                ${(SERVICE_CATALOG[tag] || []).map(([itemName, price]) => `
                  <div class="menu-item"><span>${itemName}</span><span class="menu-price">R${price}</span></div>
                `).join('')}
              </div>
            `).join('')}
          </div>
        </section>`;
    }

    let currentStudio = null, currentSlug = null, currentStaff = [];

    function render(){
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('studio');
      const studio = slug && STUDIOS[slug];
      const page = document.getElementById('page');

      if (!studio){
        page.innerHTML = `
          <div class="not-found">
            <h2>We couldn't find that studio</h2>
            <p>It may have been renamed or removed. <a href="beauty-spa.html">Back to Beauty / Spa →</a></p>
          </div>`;
        document.title = 'Studio not found — @MySalon';
        return;
      }

      document.title = studio.name + ' — @MySalon';
      const staff = staffFor(slug, studio);
      currentStudio = studio;
      currentSlug = slug;
      currentStaff = staff;

      page.innerHTML = `
        ${heroHtml(studio)}
        ${menuHtml(studio)}
        ${exhibitionHtml(studio)}
        <section class="staff-section">
          <div class="staff-head">
            <h2>Who's working <span>today</span></h2>
          </div>
          <div class="staff-sub sans">4 therapist slots at ${studio.name} — tap an available therapist to book with them directly.</div>
          <div class="staff-grid">
            ${staff.map((w, i) => `
              <div class="staff-card" data-idx="${i}">
                <div class="staff-top">
                  <div class="staff-avatar">${initials(w.name)}<span class="staff-avatar-cam">📷</span></div>
                  <div class="staff-id">
                    <h4>${w.name}</h4>
                    <div class="staff-role sans">${w.role}</div>
                    <div class="staff-status ${w.working ? 'working' : 'off'} sans"><span class="dot"></span>${w.working ? 'Working today' : 'Off today'}</div>
                  </div>
                </div>
                <div class="staff-portfolio-label">Catalog</div>
                <div class="staff-portfolio">
                  ${Array.from({ length: 8 }).map(() => '<div class="pf-thumb">Photo</div>').join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </section>`;

      document.getElementById('heroBookBtn').addEventListener('click', (e) => { e.preventDefault(); openStudioMenu(); });
      document.querySelectorAll('#exhibitGrid .exhibit-photo').forEach(el => {
        el.addEventListener('click', () => openPhotoLightbox('studio', null, Number(el.dataset.pi)));
      });
      document.querySelectorAll('.staff-card').forEach(card => {
        card.addEventListener('click', () => openWorkerProfile(Number(card.dataset.idx)));
      });
    }

    // ---------- Lightbox: shared by the studio exhibition and each therapist's portfolio ----------
    const lightboxOverlay = document.getElementById('lightboxOverlay');
    const lightboxPhoto = document.getElementById('lightboxPhoto');
    let lightboxKind = 'studio', lightboxWorkerIdx = null, lightboxIdx = 0;

    function renderLightbox(){
      const label = lightboxKind === 'studio' ? currentStudio.name : currentStaff[lightboxWorkerIdx].name.split(' ')[0];
      lightboxPhoto.textContent = `${label}'s portfolio — Photo ${lightboxIdx + 1} of 8`;
      document.getElementById('lightboxPrev').disabled = lightboxIdx === 0;
      document.getElementById('lightboxNext').disabled = lightboxIdx === 7;
    }
    function openPhotoLightbox(kind, workerIdx, pi){
      lightboxKind = kind;
      lightboxWorkerIdx = workerIdx;
      lightboxIdx = pi;
      renderLightbox();
      lightboxOverlay.classList.add('open');
    }
    document.getElementById('lightboxClose').addEventListener('click', () => lightboxOverlay.classList.remove('open'));
    lightboxOverlay.addEventListener('click', (e) => { if (e.target === lightboxOverlay) lightboxOverlay.classList.remove('open'); });
    document.getElementById('lightboxPrev').addEventListener('click', () => { if (lightboxIdx > 0){ lightboxIdx--; renderLightbox(); } });
    document.getElementById('lightboxNext').addEventListener('click', () => { if (lightboxIdx < 7){ lightboxIdx++; renderLightbox(); } });

    // ---------- Worker modal: profile → book a time → message the therapist ----------
    const workerOverlay = document.getElementById('workerModalOverlay');
    const workerBox = document.getElementById('workerModalBox');
    const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const HOURS = ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];

    function nextDays(n){
      const days = [];
      const today = new Date();
      for (let i = 0; i < n; i++){ const d = new Date(today); d.setDate(today.getDate() + i); days.push(d); }
      return days;
    }
    function hourTaken(seed, dayIdx, hourIdx){ return ((seed + dayIdx * 5 + hourIdx * 7) % 4) === 0; }
    function closeWorkerModal(){ workerOverlay.classList.remove('open'); bookingDay = null; bookingHour = null; }

    let bookingDay = null, bookingHour = null;
    let selectedItems = [];
    let bookingMode = null; // 'worker' or 'studio'
    let bookingWorkerIdx = null;

    function itemSummary(){
      const names = selectedItems.map(i => i.name);
      const total = selectedItems.reduce((sum, i) => sum + Number(i.price), 0);
      return { names, total };
    }
    function updateContinueBtn(accent){
      const btn = document.getElementById('wmContinue');
      if (!btn) return;
      if (selectedItems.length === 0){ btn.disabled = true; btn.textContent = 'Choose at least one item to continue'; }
      else {
        const { names, total } = itemSummary();
        btn.disabled = false;
        btn.textContent = names.length === 1 ? `Continue with ${names[0]} · R${total}` : `Continue with ${names.length} items · R${total}`;
      }
    }
    function coverHtml(color){ return `<div class="wm-cover" style="background:${color};"></div>`; }
    function avatarHtml(name){ return `<div class="wm-avatar">${initials(name)}<span class="wm-avatar-cam">📷</span></div>`; }

    function openWorkerProfile(idx){
      const w = currentStaff[idx];
      const studio = currentStudio;
      const accent = studio.theme.accent;
      bookingMode = 'worker';
      bookingWorkerIdx = idx;
      bookingDay = null; bookingHour = null;

      workerBox.innerHTML = `
        <button type="button" class="modal-close" id="wmClose">✕</button>
        <div class="wm-hero" style="background:linear-gradient(135deg, ${accent}, ${studio.theme.accentDark});">
          ${coverHtml(w.coverColor)}
          ${avatarHtml(w.name)}
          <h3>${w.name}</h3>
          <div class="wm-role">${w.role} · ${studio.name}</div>
        </div>
        <div class="wm-body">
          <div class="wm-label">What ${w.name.split(' ')[0]} is known for</div>
          <div class="wm-services">
            ${w.services.map(s => `<div class="wm-svc-row" style="display:flex; justify-content:space-between; font-size:13px;"><span>${s.name}</span><b>R${s.price}</b></div>`).join('')}
          </div>
          <div class="wm-label">Portfolio <span style="font-weight:400; color:#a89a86; font-size:11.5px;">(tap to enlarge)</span></div>
          <div class="wm-portfolio" id="wmPortfolio">
            ${Array.from({ length: 8 }).map((_, pi) => `<div class="wm-photo" data-pi="${pi}">Photo ${pi + 1}</div>`).join('')}
          </div>
          <div class="wm-label">Send a message</div>
          <div class="wm-message"><textarea id="wmMsgInput" placeholder="Ask ${w.name.split(' ')[0]} a question before you book…"></textarea></div>
          <div class="wm-actions">
            <button type="button" class="wm-btn ghost" id="wmSendMsg">Send message</button>
            <button type="button" class="wm-btn primary" id="wmGoBook" style="background:${accent};" ${w.working ? '' : 'disabled'}>${w.working ? 'Book a time' : 'Unavailable today'}</button>
          </div>
        </div>`;

      document.getElementById('wmClose').addEventListener('click', closeWorkerModal);
      document.getElementById('wmSendMsg').addEventListener('click', () => {
        const box = document.getElementById('wmMsgInput');
        if (!box.value.trim()) return;
        box.value = '';
        box.placeholder = `Message sent to ${w.name.split(' ')[0]} — they'll reply here soon.`;
      });
      document.querySelectorAll('#wmPortfolio .wm-photo').forEach(el => {
        el.addEventListener('click', () => openPhotoLightbox('worker', idx, Number(el.dataset.pi)));
      });
      document.getElementById('wmGoBook').addEventListener('click', () => openMenuStep());

      workerOverlay.classList.add('open');
    }

    function openMenuStep(){
      const studio = currentStudio;
      const accent = studio.theme.accent;
      const w = bookingMode === 'worker' ? currentStaff[bookingWorkerIdx] : null;
      selectedItems = [];

      const heroName = w ? w.name : studio.name;
      const heroRole = w ? `${w.role} · ${studio.name}` : 'Pick one or more — you can combine services';
      const cover = w ? coverHtml(w.coverColor) : coverHtml(paletteFor(studio)[hashStr(studio.name) % 4]);

      workerBox.innerHTML = `
        <button type="button" class="modal-close" id="wmClose">✕</button>
        <div class="wm-hero" style="background:linear-gradient(135deg, ${accent}, ${studio.theme.accentDark});">
          ${cover}
          ${avatarHtml(heroName)}
          <h3>${w ? `Book ${w.name}` : `Book at ${studio.name}`}</h3>
          <div class="wm-role">${heroRole}</div>
        </div>
        <div class="wm-body">
          <div class="wm-label">Menu — pick one or more</div>
          <div class="wm-services" id="wmMenu">
            ${studio.tags.map(tag => (SERVICE_CATALOG[tag] || []).map(([name, price]) => `
              <div class="wm-svc-row" data-name="${name}" data-price="${price}" style="cursor:pointer; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:#fff; display:flex; align-items:center; gap:10px;">
                <span class="wm-svc-check" style="width:18px; height:18px; border-radius:5px; border:1.5px solid #cbbfa9; flex:none; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff;"></span>
                <span style="flex:1;">${name} <span style="color:#a89a86; font-size:11px;">· ${tag}</span></span>
                <b>R${price}</b>
              </div>
            `).join('')).join('')}
          </div>
          <div class="wm-actions">
            <button type="button" class="wm-btn primary" id="wmContinue" style="background:${accent};" disabled>Choose at least one item to continue</button>
          </div>
        </div>`;

      document.getElementById('wmClose').addEventListener('click', closeWorkerModal);
      document.querySelectorAll('#wmMenu .wm-svc-row').forEach(row => {
        row.addEventListener('click', () => {
          const name = row.dataset.name, price = row.dataset.price;
          const idx = selectedItems.findIndex(i => i.name === name);
          const check = row.querySelector('.wm-svc-check');
          if (idx >= 0){ selectedItems.splice(idx, 1); row.style.borderColor = 'var(--line)'; row.style.background = '#fff'; check.style.background = 'transparent'; check.textContent = ''; }
          else { selectedItems.push({ name, price }); row.style.borderColor = accent; row.style.background = 'rgba(0,0,0,0.02)'; check.style.background = accent; check.style.borderColor = accent; check.textContent = '✓'; }
          updateContinueBtn(accent);
        });
      });
      document.getElementById('wmContinue').addEventListener('click', () => { if (selectedItems.length) openCalendar(); });
    }

    function openStudioMenu(){
      bookingMode = 'studio';
      bookingWorkerIdx = null;
      openMenuStep();
      workerOverlay.classList.add('open');
    }

    function openCalendar(){
      const studio = currentStudio;
      const accent = studio.theme.accent;
      const w = bookingMode === 'worker' ? currentStaff[bookingWorkerIdx] : null;
      const seed = hashStr(currentSlug + (w ? w.name : 'studio')) + 5;
      const days = nextDays(7);
      const { names, total } = itemSummary();
      const cover = w ? coverHtml(w.coverColor) : coverHtml(paletteFor(studio)[hashStr(studio.name) % 4]);

      workerBox.innerHTML = `
        <button type="button" class="modal-close" id="wmClose">✕</button>
        <div class="wm-hero" style="background:linear-gradient(135deg, ${accent}, ${studio.theme.accentDark});">
          ${cover}
          ${avatarHtml(w ? w.name : studio.name)}
          <h3>${names.join(' + ')}</h3>
          <div class="wm-role">${w ? w.name : studio.name} · R${total}</div>
        </div>
        <div class="wm-body">
          <div class="wm-label">Choose a day</div>
          <div class="wm-day-row" id="wmDayRow">
            ${days.map((d, i) => `<div class="wm-day" data-i="${i}"><div class="d-dow">${DOW[d.getDay()]}</div><div class="d-num">${d.getDate()}</div></div>`).join('')}
          </div>
          <div id="wmHoursWrap"></div>
          <div id="wmNoteWrap"></div>
        </div>`;
      document.getElementById('wmClose').addEventListener('click', closeWorkerModal);

      document.querySelectorAll('#wmDayRow .wm-day').forEach(el => {
        el.addEventListener('click', () => {
          document.querySelectorAll('#wmDayRow .wm-day').forEach(d => { d.classList.remove('active'); d.style.background = ''; });
          el.classList.add('active'); el.style.background = accent;
          bookingDay = Number(el.dataset.i); bookingHour = null;
          renderHours(seed, bookingDay, accent);
          document.getElementById('wmNoteWrap').innerHTML = '';
        });
      });
    }

    function renderHours(seed, dayIdx, accent){
      const wrap = document.getElementById('wmHoursWrap');
      wrap.innerHTML = `
        <div class="wm-label">Available hours</div>
        <div class="wm-hours" id="wmHours">
          ${HOURS.map((h, hi) => { const taken = hourTaken(seed, dayIdx, hi); return `<div class="wm-hour ${taken ? 'taken' : ''}" data-h="${hi}">${h}</div>`; }).join('')}
        </div>`;
      document.querySelectorAll('#wmHours .wm-hour').forEach(el => {
        if (el.classList.contains('taken')) return;
        el.addEventListener('click', () => {
          document.querySelectorAll('#wmHours .wm-hour').forEach(h => { h.classList.remove('active'); h.style.background = ''; });
          el.classList.add('active'); el.style.background = accent;
          bookingHour = Number(el.dataset.h);
          renderNote(accent);
        });
      });
    }

    function renderNote(accent){
      const studio = currentStudio;
      const w = bookingMode === 'worker' ? currentStaff[bookingWorkerIdx] : null;
      const wrap = document.getElementById('wmNoteWrap');
      const who = w ? w.name.split(' ')[0] : studio.name;
      wrap.innerHTML = `
        <div class="wm-label">Add a note for ${who}</div>
        <div class="wm-message"><textarea id="wmBookNote" placeholder="e.g. 'Bad lower back — please go gentle' or 'First time here'"></textarea></div>
        <div class="wm-actions"><button type="button" class="wm-btn primary" id="wmSendRequest" style="background:${accent};">Send booking request</button></div>`;
      document.getElementById('wmSendRequest').addEventListener('click', () => sendBookingRequest(accent));
    }

    function sendBookingRequest(accent){
      const studio = currentStudio;
      const w = bookingMode === 'worker' ? currentStaff[bookingWorkerIdx] : null;
      const who = w ? w.name : studio.name;
      const whoFirst = w ? w.name.split(' ')[0] : studio.name;
      const day = nextDays(7)[bookingDay];
      const dayLabel = `${DOW[day.getDay()]} ${day.getDate()}`;
      const hourLabel = HOURS[bookingHour];
      const noteEl = document.getElementById('wmBookNote');
      const note = (noteEl && noteEl.value.trim()) || null;
      const { names, total } = itemSummary();
      const itemsLabel = names.join(', ');
      const cover = w ? coverHtml(w.coverColor) : coverHtml(paletteFor(studio)[hashStr(studio.name) % 4]);

      workerBox.innerHTML = `
        <button type="button" class="modal-close" id="wmClose">✕</button>
        <div class="wm-hero" style="background:linear-gradient(135deg, ${accent}, ${studio.theme.accentDark});">
          ${cover}
          ${avatarHtml(who)}
          <h3>${who}</h3>
          <div class="wm-role">${names.join(' + ')} · ${dayLabel} · ${hourLabel}</div>
        </div>
        <div class="wm-body">
          <div id="wmChatArea">
            <div class="wm-chat" id="wmChat">
              <div class="wm-bubble me">Hi ${whoFirst}! I'd like to book ${itemsLabel} (R${total}) for ${dayLabel} at ${hourLabel}.${note ? ' ' + note : ''}</div>
              <div class="wm-typing" id="wmTyping">${whoFirst} is typing…</div>
            </div>
          </div>
        </div>`;
      document.getElementById('wmClose').addEventListener('click', closeWorkerModal);

      setTimeout(() => {
        const seed = hashStr(currentSlug + who + itemsLabel) + bookingDay * 3 + bookingHour;
        const replies = [
          `That works for me — see you ${dayLabel} at ${hourLabel} for ${itemsLabel}! I'll confirm the day before.`,
          `We're actually booked right at ${hourLabel} — could you do an hour later on ${dayLabel}?`,
          `Yes! Just holding your spot for ${itemsLabel}. Let me know if anything changes before ${dayLabel}.`
        ];
        const reply = replies[seed % replies.length];
        const typing = document.getElementById('wmTyping');
        if (typing) typing.remove();
        const chat = document.getElementById('wmChat');
        const area = document.getElementById('wmChatArea');
        if (chat && area){
          chat.insertAdjacentHTML('beforeend', `<div class="wm-bubble them">${reply}</div>`);
          area.insertAdjacentHTML('beforeend', `<div class="wm-proto-note">Prototype — this reply is simulated. Real booking would message ${whoFirst} directly and hold the slot.</div>`);
          addFollowUpComposer(chat, whoFirst, accent);
        }
      }, 1100);
    }

    const ACKS = ["Got it, thanks for letting us know!", "No problem — see you then.", "Thanks for the update, we'll be ready."];
    function addFollowUpComposer(chatEl, personFirstName, accent){
      const area = document.getElementById('wmChatArea');
      if (!area || document.getElementById('wmFollowInput')) return;
      area.insertAdjacentHTML('beforeend', `
        <div class="wm-follow-row">
          <input id="wmFollowInput" type="text" placeholder="Message ${personFirstName} — e.g. 'Running 10 min late'">
          <button type="button" id="wmFollowSend" style="background:${accent};">Send</button>
        </div>`);
      document.getElementById('wmFollowSend').addEventListener('click', () => {
        const input = document.getElementById('wmFollowInput');
        const text = input.value.trim();
        if (!text) return;
        chatEl.insertAdjacentHTML('beforeend', `<div class="wm-bubble me">${text}</div>`);
        input.value = '';
        const typingId = 'wmFollowTyping' + Date.now();
        chatEl.insertAdjacentHTML('beforeend', `<div class="wm-typing" id="${typingId}">${personFirstName} is typing…</div>`);
        setTimeout(() => {
          const t = document.getElementById(typingId);
          if (t) t.remove();
          const ack = ACKS[hashStr(text) % ACKS.length];
          chatEl.insertAdjacentHTML('beforeend', `<div class="wm-bubble them">${ack}</div>`);
        }, 900);
      });
    }

    // ---------- Palette customizer — re-themes the live page against your own brand colour ----------
    const PALETTE_PRESETS = ['#7A1F2A','#C9A961','#3F6B4A','#5E8C86','#7B5EA7','#D63C7A','#B8794A','#A23B4E','#6E8B8B','#D97B56','#241E1A','#3A322C'];
    let profileDefaultTheme = null;

    function darkenColor(hex, amt){
      const c = hex.replace('#', '');
      const num = parseInt(c, 16);
      let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
      r = Math.round(r * (1 - amt)); g = Math.round(g * (1 - amt)); b = Math.round(b * (1 - amt));
      return '#' + [r, g, b].map(x => Math.max(0, Math.min(255, x)).toString(16).padStart(2, '0')).join('');
    }

    function applyPaletteColor(hex){
      if (!currentStudio) return;
      if (!profileDefaultTheme) profileDefaultTheme = { accent: currentStudio.theme.accent, accentDark: currentStudio.theme.accentDark };
      currentStudio.theme.accent = hex;
      currentStudio.theme.accentDark = darkenColor(hex, 0.35);
      render();
    }

    document.getElementById('paletteSwatches').innerHTML = PALETTE_PRESETS.map(c => `<button type="button" class="palette-swatch" data-color="${c}" style="background:${c};"></button>`).join('');
    document.querySelectorAll('.palette-swatch').forEach(sw => {
      sw.addEventListener('click', () => applyPaletteColor(sw.dataset.color));
    });
    document.getElementById('paletteCustomInput').addEventListener('input', (e) => applyPaletteColor(e.target.value));
    document.getElementById('paletteFab').addEventListener('click', () => {
      document.getElementById('palettePanel').classList.toggle('open');
    });
    document.getElementById('paletteResetBtn').addEventListener('click', () => {
      if (!profileDefaultTheme || !currentStudio) return;
      currentStudio.theme.accent = profileDefaultTheme.accent;
      currentStudio.theme.accentDark = profileDefaultTheme.accentDark;
      render();
    });

    render();
  </script>

  <script>
  (function(){
    const burgerBtn = document.getElementById('burgerBtn');
    const menuPanel = document.getElementById('menuPanel');
    if (burgerBtn && menuPanel){
      burgerBtn.addEventListener('click', function(e){
        e.stopPropagation();
        menuPanel.classList.toggle('open');
      });
      document.addEventListener('click', function(e){
        if (!menuPanel.contains(e.target) && e.target !== burgerBtn){
          menuPanel.classList.remove('open');
        }
      });
    }
  })();
  </script>
</body>
</html>
